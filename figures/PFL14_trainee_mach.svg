<svg viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr4" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1F3864"/>
    </marker>
  </defs>
  <!-- Axes -->
  <line x1="60" y1="20" x2="60" y2="170" stroke="#1F3864" stroke-width="2" marker-end="url(#arr4)"/>
  <line x1="60" y1="170" x2="680" y2="170" stroke="#1F3864" stroke-width="2" marker-end="url(#arr4)"/>
  <text x="35" y="100" text-anchor="middle" font-family="Arial" font-size="11" fill="#1F3864" transform="rotate(-90,35,100)">Traînée (Cx)</text>
  <text x="680" y="185" text-anchor="middle" font-family="Arial" font-size="11" fill="#1F3864">Mach</text>
  <!-- Courbe de traînée -->
  <!-- subsonic : légèrement décroissant, puis remontée transsonique, puis forte bosse, puis rechute supersonique -->
  <polyline points="80,145 160,138 260,132 320,130 360,131 390,136 420,120 450,90 480,60 510,45 530,55 560,75 600,90 650,95"
            fill="none" stroke="#C00000" stroke-width="2.5"/>
  <!-- Annotations Mach -->
  <!-- Mcrit -->
  <line x1="320" y1="40" x2="320" y2="170" stroke="#BF8F00" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="320" y="35" text-anchor="middle" font-family="Arial" font-size="10" fill="#BF8F00">Mcrit</text>
  <!-- Mdivdrag -->
  <line x1="390" y1="40" x2="390" y2="170" stroke="#C00000" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="390" y="35" text-anchor="middle" font-family="Arial" font-size="10" fill="#C00000">Mdiv</text>
  <!-- M=1 -->
  <line x1="490" y1="40" x2="490" y2="170" stroke="#555" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="490" y="35" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">M=1</text>
  <!-- Zones texte -->
  <text x="190" y="155" text-anchor="middle" font-family="Arial" font-size="10" fill="#548235">Subsonique</text>
  <text x="430" y="155" text-anchor="middle" font-family="Arial" font-size="10" fill="#BF8F00">Transsonique</text>
  <text x="620" y="155" text-anchor="middle" font-family="Arial" font-size="10" fill="#C00000">Supersonique</text>
  <!-- Annotation Mdiv -->
  <rect x="400" y="128" width="135" height="28" rx="4" fill="#FBE5E5" stroke="#C00000" stroke-width="1"/>
  <text x="467" y="143" text-anchor="middle" font-family="Arial" font-size="9" fill="#C00000">Mdiv : Cx total +10%</text>
  <text x="467" y="153" text-anchor="middle" font-family="Arial" font-size="9" fill="#C00000">Mdiv &gt; Mcrit</text>
  <!-- Traînée d'onde label -->
  <text x="545" y="70" font-family="Arial" font-size="10" fill="#C00000">Traînée</text>
  <text x="545" y="82" font-family="Arial" font-size="10" fill="#C00000">d'onde</text>
</svg>
