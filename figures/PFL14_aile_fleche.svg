<svg viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr5" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1F3864"/>
    </marker>
    <marker id="arr5b" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#C00000"/>
    </marker>
    <marker id="arr5g" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#548235"/>
    </marker>
  </defs>
  <!-- Profil simplifié d'aile en flèche -->
  <polygon points="60,100 300,30 580,30 580,50 300,60 60,130" fill="#DEEAF6" stroke="#2E75B6" stroke-width="1.5"/>
  <!-- Bord d'attaque en flèche -->
  <line x1="60" y1="100" x2="300" y2="30" stroke="#2E75B6" stroke-width="2.5"/>
  <!-- Vecteur V0 (vitesse incidente, horizontal) -->
  <line x1="350" y1="120" x2="510" y2="120" stroke="#1F3864" stroke-width="2.5" marker-end="url(#arr5)"/>
  <text x="520" y="124" font-family="Arial" font-size="12" fill="#1F3864" font-weight="bold">V₀</text>
  <!-- Vecteur VN (perpendiculaire au bord d'attaque) -->
  <line x1="350" y1="120" x2="380" y2="55" stroke="#C00000" stroke-width="2.5" marker-end="url(#arr5b)"/>
  <text x="352" y="45" font-family="Arial" font-size="12" fill="#C00000" font-weight="bold">V_N</text>
  <!-- Angle phi -->
  <path d="M 410,120 A 60,60 0 0,0 365,82" fill="none" stroke="#BF8F00" stroke-width="1.5"/>
  <text x="425" y="115" font-family="Arial" font-size="13" fill="#BF8F00" font-style="italic">φ</text>
  <!-- Formule -->
  <rect x="430" y="140" width="220" height="42" rx="6" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.5"/>
  <text x="540" y="158" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1F3864">V_N = V₀ × cos φ</text>
  <text x="540" y="176" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">φ ↑ → V_N ↓ → Mcrit ↑</text>
  <!-- Label flèche -->
  <text x="160" y="185" text-anchor="middle" font-family="Arial" font-size="10" fill="#2E75B6">Angle de flèche φ</text>
</svg>
