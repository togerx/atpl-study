<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">
  <!-- Background -->
  <rect width="720" height="420" fill="#F8F9FA" rx="8"/>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1F3864">Double Circulation: Pulmonary &amp; Systemic</text>

  <!-- HEART CENTER BOX -->
  <rect x="290" y="160" width="140" height="100" rx="10" fill="#FBE5E5" stroke="#C00000" stroke-width="2"/>
  <text x="360" y="200" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#C00000">HEART</text>
  <text x="360" y="218" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="9.5" fill="#1F3864">Left → Systemic circ.</text>
  <text x="360" y="234" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="9.5" fill="#1F3864">Right → Pulmonary circ.</text>
  <text x="360" y="250" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#555">4 chambers</text>

  <!-- LUNGS BOX (top) -->
  <rect x="290" y="50" width="140" height="70" rx="8" fill="#DEEAF6" stroke="#2E75B6" stroke-width="2"/>
  <text x="360" y="78" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#2E75B6">LUNGS</text>
  <text x="360" y="96" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#1F3864">Gas exchange (O₂/CO₂)</text>
  <text x="360" y="111" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#1F3864">300M alveolar ducts</text>

  <!-- BODY/TISSUES BOX (bottom) -->
  <rect x="290" y="300" width="140" height="70" rx="8" fill="#E2EFDA" stroke="#548235" stroke-width="2"/>
  <text x="360" y="328" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#548235">BODY TISSUES</text>
  <text x="360" y="346" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#1F3864">O₂ delivered → metabolism</text>
  <text x="360" y="361" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#1F3864">CO₂ returned to heart</text>

  <!-- PULMONARY CIRCUIT: Heart → Lungs (LEFT side, deoxygenated = blue) -->
  <!-- Arrow up left: Heart to Lungs (deoxygenated) -->
  <line x1="290" y1="185" x2="230" y2="185" stroke="#2E75B6" stroke-width="2.5"/>
  <line x1="230" y1="185" x2="230" y2="85" stroke="#2E75B6" stroke-width="2.5"/>
  <line x1="230" y1="85" x2="290" y2="85" stroke="#2E75B6" stroke-width="2.5"/>
  <polygon points="290,85 280,80 280,90" fill="#2E75B6"/>
  <text x="205" y="143" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#2E75B6" transform="rotate(-90,205,143)">Pulmonary artery</text>
  <text x="135" y="143" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="8" fill="#555" transform="rotate(-90,135,143)">(deoxygenated)</text>

  <!-- Arrow down right: Lungs to Heart (oxygenated = red) -->
  <line x1="430" y1="85" x2="490" y2="85" stroke="#C00000" stroke-width="2.5"/>
  <line x1="490" y1="85" x2="490" y2="185" stroke="#C00000" stroke-width="2.5"/>
  <line x1="490" y1="185" x2="430" y2="185" stroke="#C00000" stroke-width="2.5"/>
  <polygon points="430,185 440,180 440,190" fill="#C00000"/>
  <text x="515" y="143" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#C00000" transform="rotate(90,515,143)">Pulmonary veins</text>
  <text x="545" y="143" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="8" fill="#555" transform="rotate(90,545,143)">(oxygenated)</text>

  <!-- SYSTEMIC CIRCUIT: Heart → Body (RIGHT side) -->
  <!-- Arrow down right: Heart to Body (oxygenated = red) -->
  <line x1="430" y1="235" x2="570" y2="235" stroke="#C00000" stroke-width="2.5"/>
  <line x1="570" y1="235" x2="570" y2="335" stroke="#C00000" stroke-width="2.5"/>
  <line x1="570" y1="335" x2="430" y2="335" stroke="#C00000" stroke-width="2.5"/>
  <polygon points="430,335 440,330 440,340" fill="#C00000"/>
  <text x="595" y="290" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#C00000" transform="rotate(90,595,290)">Aorta / Arteries</text>
  <text x="625" y="290" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="8" fill="#555" transform="rotate(90,625,290)">(oxygenated)</text>

  <!-- Arrow up left: Body to Heart (deoxygenated = blue) -->
  <line x1="290" y1="335" x2="150" y2="335" stroke="#2E75B6" stroke-width="2.5"/>
  <line x1="150" y1="335" x2="150" y2="235" stroke="#2E75B6" stroke-width="2.5"/>
  <line x1="150" y1="235" x2="290" y2="235" stroke="#2E75B6" stroke-width="2.5"/>
  <polygon points="290,235 280,230 280,240" fill="#2E75B6"/>
  <text x="125" y="290" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#2E75B6" transform="rotate(-90,125,290)">Vena cava / Veins</text>
  <text x="95" y="290" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="8" fill="#555" transform="rotate(-90,95,290)">(deoxygenated)</text>

  <!-- Legend -->
  <rect x="30" y="375" width="14" height="8" fill="#C00000"/>
  <text x="50" y="383" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#333">Oxygenated blood</text>
  <rect x="200" y="375" width="14" height="8" fill="#2E75B6"/>
  <text x="220" y="383" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#333">Deoxygenated blood</text>

  <!-- Labels for circuits -->
  <text x="50" y="130" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2E75B6">PULMONARY</text>
  <text x="50" y="145" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2E75B6">CIRCUIT</text>
  <text x="620" y="290" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#548235" transform="rotate(90,620,290)">SYSTEMIC CIRCUIT</text>
</svg>
