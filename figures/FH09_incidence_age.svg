<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <!-- Titre du graphique -->
  <text x="300" y="30" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1F3864" text-anchor="middle">Évolution de la susceptibilité à la cinétose selon l'âge</text>

  <!-- Zone ombrée : Pic d'adolescence (10 à 15 ans) -->
  <rect x="150" y="60" width="50" height="260" fill="#FFF2CC" fill-opacity="0.6"/>
  <line x1="150" y1="60" x2="150" y2="320" stroke="#BF8F00" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="200" y1="60" x2="200" y2="320" stroke="#BF8F00" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="175" y="50" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#BF8F00" text-anchor="middle">Pic (10 - 15 ans)</text>

  <!-- Grille horizontale indicatrice -->
  <line x1="80" y1="190" x2="550" y2="190" stroke="#E5E5E5" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="80" y1="60" x2="550" y2="60" stroke="#E5E5E5" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Axes cartésiens -->
  <!-- Axe Y (Sensibilité) -->
  <line x1="80" y1="60" x2="80" y2="320" stroke="#1F3864" stroke-width="2"/>
  <!-- Axe X (Âge) -->
  <line x1="80" y1="320" x2="550" y2="320" stroke="#1F3864" stroke-width="2"/>

  <!-- Graduations Axe X (Âge en années) -->
  <text x="80" y="338" font-family="Arial, sans-serif" font-size="9.5" fill="#555555" text-anchor="middle">0</text>
  <text x="150" y="338" font-family="Arial, sans-serif" font-size="9.5" fill="#555555" text-anchor="middle">10</text>
  <text x="220" y="338" font-family="Arial, sans-serif" font-size="9.5" fill="#555555" text-anchor="middle">20</text>
  <text x="290" y="338" font-family="Arial, sans-serif" font-size="9.5" fill="#555555" text-anchor="middle">30</text>
  <text x="360" y="338" font-family="Arial, sans-serif" font-size="9.5" fill="#555555" text-anchor="middle">40</text>
  <text x="430" y="338" font-family="Arial, sans-serif" font-size="9.5" fill="#555555" text-anchor="middle">50</text>
  <text x="500" y="338" font-family="Arial, sans-serif" font-size="9.5" fill="#555555" text-anchor="middle">60</text>
  <text x="315" y="362" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1F3864" text-anchor="middle">Âge (années)</text>

  <!-- Graduations Axe Y (Niveau de susceptibilité) -->
  <text x="70" y="324" font-family="Arial, sans-serif" font-size="9.5" fill="#555555" text-anchor="end">0%</text>
  <text x="70" y="194" font-family="Arial, sans-serif" font-size="9.5" fill="#555555" text-anchor="end">50%</text>
  <text x="70" y="64" font-family="Arial, sans-serif" font-size="9.5" fill="#555555" text-anchor="end">100%</text>
  
  <!-- Titre de l'axe Y tourné -->
  <text x="25" y="190" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1F3864" text-anchor="middle" transform="rotate(-90,25,190)">Sensibilité relative</text>

  <!-- Tracé de la courbe physiologique (Bézier splines) -->
  <!-- Début bas à 0 an, hausse violente vers 12 ans, descente progressive après 20 ans -->
  <path d="M 80,315 C 100,315 135,160 165,70 C 185,10 215,160 290,230 C 370,300 460,305 540,310" fill="none" stroke="#C00000" stroke-width="3"/>

  <!-- Note informative sur l'immunité des nourrissons -->
  <rect x="95" y="240" width="100" height="35" rx="3" fill="#DEEAF6" stroke="#2E75B6" stroke-width="0.5"/>
  <text x="145" y="253" font-family="Arial, sans-serif" font-size="8" fill="#1F3864" text-anchor="middle">0 - 2 ans :</text>
  <text x="145" y="265" font-family="Arial, sans-serif" font-size="8" fill="#1F3864" text-anchor="middle">Quasi-immunité</text>
</svg>
