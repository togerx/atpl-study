<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <text x="380" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F3864">Surveillance des vibrations et Synchroscope</text>

  <defs>
    <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F3864"/>
    </marker>
    <marker id="av_r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C00000"/>
    </marker>
  </defs>

  <!-- ═══════════ PARTIE GAUCHE : VIBRATIONS ═══════════ -->
  <rect x="10" y="32" width="490" height="30" rx="6" fill="#1F3864"/>
  <text x="255" y="52" text-anchor="middle" font-size="12" font-weight="bold" fill="white">5 — Surveillance des vibrations moteur (2 capteurs/moteur)</text>

  <!-- === Méthode A : Piézoélectrique === -->
  <rect x="10" y="68" width="235" height="130" rx="5" fill="#DEEAF6" stroke="#2E75B6" stroke-width="1.5"/>
  <text x="127" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F3864">A — Piézoélectrique</text>

  <!-- Cristal piézo -->
  <rect x="45" y="95" width="50" height="50" rx="4" fill="#c0c8f0" stroke="#2E75B6" stroke-width="2"/>
  <text x="70" y="118" text-anchor="middle" font-size="9" fill="#1F3864">Cristal</text>
  <text x="70" y="131" text-anchor="middle" font-size="9" fill="#2E75B6">Piézo</text>
  <!-- Masse -->
  <rect x="55" y="83" width="30" height="14" rx="3" fill="#888"/>
  <text x="70" y="93" text-anchor="middle" font-size="8" fill="white">Masse</text>
  <!-- Flèche vibration -->
  <path d="M 30 120 Q 25 110 30 100 Q 35 110 30 120" fill="none" stroke="#C00000" stroke-width="2"/>
  <text x="18" y="115" font-size="8" fill="#C00000">Vib.</text>
  <!-- Signal sortie -->
  <line x1="95" y1="120" x2="130" y2="120" stroke="#2E75B6" stroke-width="1.5" marker-end="url(#av)"/>
  <text x="115" y="115" text-anchor="middle" font-size="8" fill="#2E75B6">V élec</text>

  <text x="127" y="155" text-anchor="middle" font-size="8.5" fill="#1F3864">Compression/décompression</text>
  <text x="127" y="167" text-anchor="middle" font-size="8.5" fill="#1F3864">du cristal → tension électrique</text>
  <text x="127" y="179" text-anchor="middle" font-size="8.5" fill="#1F3864">proportionnelle aux vibrations</text>

  <!-- Fixé sur moteur -->
  <text x="127" y="192" text-anchor="middle" font-size="8" fill="#555">Monté rigide sur le corps moteur</text>

  <!-- === Méthode B : Bobine/Aimant === -->
  <rect x="255" y="68" width="245" height="130" rx="5" fill="#E2EFDA" stroke="#548235" stroke-width="1.5"/>
  <text x="377" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F3864">B — Bobine / Aimant suspendu</text>

  <!-- Corps moteur -->
  <rect x="270" y="100" width="100" height="75" rx="4" fill="#d0e8d0" stroke="#548235" stroke-width="1.5"/>
  <text x="320" y="120" text-anchor="middle" font-size="8" fill="#1F3864">Corps</text>
  <text x="320" y="132" text-anchor="middle" font-size="8" fill="#1F3864">moteur</text>
  <!-- Bobine fixe -->
  <rect x="285" y="112" width="30" height="50" rx="2" fill="#888" stroke="#555" stroke-width="1"/>
  <text x="300" y="128" text-anchor="middle" font-size="7" fill="white">Bobine</text>
  <text x="300" y="138" text-anchor="middle" font-size="7" fill="white">fixe</text>
  <!-- Aimant suspendu (N S) -->
  <rect x="295" y="122" width="18" height="28" rx="2" fill="#C00000" stroke="#800000" stroke-width="1"/>
  <text x="304" y="134" text-anchor="middle" font-size="7" fill="white">N</text>
  <text x="304" y="147" text-anchor="middle" font-size="7" fill="white">S</text>
  <text x="320" y="160" text-anchor="middle" font-size="7.5" fill="#C00000">Aimant</text>
  <text x="320" y="170" text-anchor="middle" font-size="7.5" fill="#C00000">suspendu</text>

  <!-- Signal sortie -->
  <line x1="370" y1="137" x2="415" y2="137" stroke="#548235" stroke-width="1.5" marker-end="url(#av)"/>
  <text x="425" y="133" font-size="7.5" fill="#548235">V AC</text>
  <text x="425" y="145" font-size="7.5" fill="#548235">∝ vib.</text>

  <text x="377" y="165" text-anchor="middle" font-size="8.5" fill="#1F3864">Déplacement aimant dans bobine</text>
  <text x="377" y="177" text-anchor="middle" font-size="8.5" fill="#1F3864">→ variation flux → tension AC induite</text>
  <text x="377" y="190" text-anchor="middle" font-size="8" fill="#555">Principe : loi de Faraday (inductance)</text>

  <!-- === Chaîne de traitement === -->
  <rect x="10" y="205" width="490" height="75" rx="5" fill="#FBE5E5" stroke="#C00000" stroke-width="1.5"/>
  <text x="255" y="222" text-anchor="middle" font-size="10" font-weight="bold" fill="#C00000">Chaîne de traitement du signal de vibration</text>

  <rect x="25" y="230" width="70" height="30" rx="4" fill="#FBE5E5" stroke="#C00000" stroke-width="1"/>
  <text x="60" y="248" text-anchor="middle" font-size="8.5" fill="#1F3864">Capteur vib.</text>
  <text x="60" y="259" text-anchor="middle" font-size="8" fill="#C00000">(entrée/sortie)</text>
  <line x1="95" y1="245" x2="120" y2="245" stroke="#1F3864" stroke-width="1.5" marker-end="url(#av)"/>

  <rect x="120" y="230" width="80" height="30" rx="4" fill="#DEEAF6" stroke="#2E75B6" stroke-width="1"/>
  <text x="160" y="248" text-anchor="middle" font-size="8.5" fill="#1F3864">Amplificateur</text>
  <text x="160" y="259" text-anchor="middle" font-size="8" fill="#2E75B6">+ Filtre</text>
  <line x1="200" y1="245" x2="225" y2="245" stroke="#1F3864" stroke-width="1.5" marker-end="url(#av)"/>

  <rect x="225" y="230" width="80" height="30" rx="4" fill="#E2EFDA" stroke="#548235" stroke-width="1"/>
  <text x="265" y="248" text-anchor="middle" font-size="8.5" fill="#1F3864">Redresseur</text>
  <text x="265" y="259" text-anchor="middle" font-size="8" fill="#548235">(Rectifier)</text>
  <line x1="305" y1="245" x2="330" y2="245" stroke="#1F3864" stroke-width="1.5" marker-end="url(#av)"/>

  <rect x="330" y="230" width="80" height="30" rx="4" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1"/>
  <text x="370" y="248" text-anchor="middle" font-size="8.5" fill="#1F3864">Alarme</text>
  <text x="370" y="259" text-anchor="middle" font-size="8" fill="#BF8F00">(Warning circuit)</text>
  <line x1="410" y1="245" x2="435" y2="245" stroke="#1F3864" stroke-width="1.5" marker-end="url(#av)"/>

  <rect x="435" y="230" width="60" height="30" rx="4" fill="#1F3864"/>
  <text x="465" y="248" text-anchor="middle" font-size="8" font-weight="bold" fill="white">Indicateur</text>
  <text x="465" y="259" text-anchor="middle" font-size="7.5" fill="#aad">Ampli. rel.</text>

  <text x="255" y="272" text-anchor="middle" font-size="8" fill="#555">Le filtre élimine les fréquences normales et laisse passer les fréquences anormales (N1 ou N2 identifiées)</text>

  <!-- ═══════════ PARTIE DROITE : SYNCHROSCOPE ═══════════ -->
  <rect x="510" y="32" width="240" height="30" rx="6" fill="#1F3864"/>
  <text x="630" y="52" text-anchor="middle" font-size="12" font-weight="bold" fill="white">4 — Synchroscope</text>

  <rect x="510" y="68" width="240" height="210" rx="5" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.5"/>

  <!-- Moteur maître -->
  <rect x="525" y="85" width="90" height="30" rx="4" fill="#1F3864"/>
  <text x="570" y="105" text-anchor="middle" font-size="9" font-weight="bold" fill="white">Moteur MAÎTRE</text>
  <text x="570" y="114" text-anchor="middle" font-size="8" fill="#aad">(gauche externe)</text>
  <!-- Tachogénérateur maître -->
  <rect x="535" y="120" width="70" height="20" rx="3" fill="#DEEAF6" stroke="#2E75B6" stroke-width="1"/>
  <text x="570" y="133" text-anchor="middle" font-size="8" fill="#1F3864">Tacho-gennie</text>
  <line x1="570" y1="140" x2="570" y2="165" stroke="#2E75B6" stroke-width="1.5" marker-end="url(#av)"/>

  <!-- Moteur esclave -->
  <rect x="630" y="85" width="105" height="30" rx="4" fill="#548235"/>
  <text x="682" y="105" text-anchor="middle" font-size="9" font-weight="bold" fill="white">Moteur ESCLAVE</text>
  <text x="682" y="114" text-anchor="middle" font-size="8" fill="#d0ffd0">(à synchroniser)</text>
  <!-- Tachogénérateur esclave -->
  <rect x="645" y="120" width="70" height="20" rx="3" fill="#E2EFDA" stroke="#548235" stroke-width="1"/>
  <text x="680" y="133" text-anchor="middle" font-size="8" fill="#1F3864">Tacho-gennie</text>
  <line x1="680" y1="140" x2="680" y2="165" stroke="#548235" stroke-width="1.5" marker-end="url(#av)"/>

  <!-- Voltmètre comparateur -->
  <rect x="575" y="165" width="90" height="35" rx="5" fill="#C00000" stroke="#800000" stroke-width="1.5"/>
  <text x="620" y="182" text-anchor="middle" font-size="9" font-weight="bold" fill="white">Voltmètre</text>
  <text x="620" y="194" text-anchor="middle" font-size="8" fill="#ffaaaa">comparateur f</text>

  <!-- Indicateur synchroscope -->
  <line x1="620" y1="200" x2="620" y2="215" stroke="#C00000" stroke-width="1.5" marker-end="url(#av_r)"/>
  <rect x="565" y="215" width="110" height="40" rx="5" fill="#1F3864" stroke="#0a1628" stroke-width="2"/>
  <text x="620" y="232" text-anchor="middle" font-size="9" font-weight="bold" fill="white">Synchroscope</text>
  <!-- Aiguille gauche = INCREASE, droite = DECREASE -->
  <line x1="607" y1="248" x2="620" y2="240" stroke="#ffaa00" stroke-width="2"/>
  <text x="590" y="256" font-size="7.5" fill="#aad">INC.</text>
  <text x="635" y="256" font-size="7.5" fill="#aad">DEC.</text>

  <!-- Légende synchroscope -->
  <text x="630" y="270" text-anchor="middle" font-size="8.5" fill="#1F3864">Aiguille à gauche : esclave plus lent</text>
  <text x="630" y="282" text-anchor="middle" font-size="8.5" fill="#1F3864">Aiguille à droite : esclave plus rapide</text>
  <text x="630" y="294" text-anchor="middle" font-size="8.5" fill="#BF8F00">But : réduire vibrations, bruit, conso.</text>

  <!-- Note bas -->
  <rect x="10" y="290" width="740" height="40" rx="5" fill="#E2EFDA" stroke="#548235" stroke-width="1"/>
  <text x="380" y="306" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1F3864">Unités vibrations : Amplitude Relative (sans unité physique) — Seuils numériques définis par le constructeur</text>
  <text x="380" y="320" text-anchor="middle" font-size="9" fill="#1F3864">2 accéléromètres par moteur turbine : 1 à l'entrée (N1), 1 à la sortie (N2) — Affichage ECAM : VIB N1 / VIB N2</text>

</svg>
