<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400">
  <defs>
    <marker id="arr1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2E75B6"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#C00000"/>
    </marker>
    <marker id="arr3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#BF8F00"/>
    </marker>
    <marker id="arr4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#548235"/>
    </marker>
  </defs>

  <!-- Fond léger -->
  <rect x="0" y="0" width="720" height="400" fill="#F8F9FA" rx="8"/>
  
  <!-- PISTE centrale -->
  <rect x="310" y="190" width="180" height="40" fill="#777" stroke="#333" stroke-width="2" rx="2"/>
  <line x1="310" y1="210" x2="490" y2="210" stroke="white" stroke-width="2" stroke-dasharray="15,8"/>
  <text x="400" y="214" text-anchor="middle" font-family="Arial" font-size="11" fill="white" font-weight="bold">RUNWAY</text>
  
  <!-- APRON -->
  <rect x="490" y="200" width="80" height="55" fill="#C8C8C8" stroke="#888" stroke-width="1.5" rx="3"/>
  <text x="530" y="230" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">APRON</text>

  <!-- ===================== -->
  <!-- 1 - DOWNWIND CIRCUIT -->
  <!-- ===================== -->
  <!-- Downwind (en haut, de droite à gauche) -->
  <line x1="530" y1="70" x2="260" y2="70" stroke="#2E75B6" stroke-width="2.5" marker-end="url(#arr1)"/>
  <text x="395" y="60" text-anchor="middle" font-family="Arial" font-size="11" fill="#2E75B6" font-weight="bold">1 DOWNWIND</text>
  <text x="395" y="84" text-anchor="middle" font-family="Arial" font-size="9.5" fill="#2E75B6">1500'/1000' AGL (abeam tower)</text>
  
  <!-- Base leg (gauche, descend) -->
  <line x1="260" y1="70" x2="260" y2="200" stroke="#2E75B6" stroke-width="2.5" marker-end="url(#arr1)"/>
  <text x="232" y="140" text-anchor="middle" font-family="Arial" font-size="10" fill="#2E75B6" transform="rotate(-90 232 140)">BASE LEG</text>
  
  <!-- Final (vers piste) -->
  <line x1="260" y1="200" x2="308" y2="200" stroke="#2E75B6" stroke-width="2.5" marker-end="url(#arr1)"/>
  <text x="282" y="215" text-anchor="middle" font-family="Arial" font-size="10" fill="#2E75B6">FINAL</text>
  
  <!-- Circuit montée après décollage -->
  <line x1="490" y1="200" x2="530" y2="200" stroke="#2E75B6" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr1)"/>
  <line x1="530" y1="200" x2="530" y2="70" stroke="#2E75B6" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr1)"/>
  
  <!-- Numéro 1 -->
  <circle cx="395" cy="70" r="12" fill="#2E75B6" stroke="white" stroke-width="2"/>
  <text x="395" y="74" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="white">1</text>

  <!-- ===================== -->
  <!-- 2 - LONG FINAL (straight-in) -->
  <!-- ===================== -->
  <line x1="100" y1="210" x2="308" y2="210" stroke="#C00000" stroke-width="2.5" marker-end="url(#arr2)"/>
  <text x="185" y="204" text-anchor="middle" font-family="Arial" font-size="10" fill="#C00000" font-weight="bold">2 LONG FINAL</text>
  <text x="185" y="225" text-anchor="middle" font-family="Arial" font-size="9" fill="#C00000">4/5 NM, axe piste, 1500' AGL</text>
  
  <!-- Numéro 2 -->
  <circle cx="100" cy="210" r="12" fill="#C00000" stroke="white" stroke-width="2"/>
  <text x="100" y="214" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="white">2</text>
  
  <!-- ===================== -->
  <!-- 3 - JOIN BASE -->
  <!-- ===================== -->
  <line x1="260" y1="140" x2="260" y2="198" stroke="#BF8F00" stroke-width="2.5" marker-end="url(#arr3)"/>
  <path d="M 180 115 Q 220 140 260 140" stroke="#BF8F00" stroke-width="2.5" fill="none" marker-end="url(#arr3)"/>
  <text x="180" y="110" text-anchor="middle" font-family="Arial" font-size="10" fill="#BF8F00" font-weight="bold">3 JOIN BASE</text>
  <text x="180" y="123" text-anchor="middle" font-family="Arial" font-size="9" fill="#BF8F00">1500' AGL</text>
  
  <!-- Numéro 3 -->
  <circle cx="222" cy="138" r="12" fill="#BF8F00" stroke="white" stroke-width="2"/>
  <text x="222" y="142" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="white">3</text>
  
  <!-- ===================== -->
  <!-- 4 - INITIAL POINT (military) -->
  <!-- ===================== -->
  <line x1="100" y1="290" x2="308" y2="210" stroke="#548235" stroke-width="2.5" marker-end="url(#arr4)" stroke-dasharray="6,3"/>
  <text x="120" y="310" text-anchor="middle" font-family="Arial" font-size="10" fill="#548235" font-weight="bold">4 INITIAL POINT</text>
  <text x="120" y="323" text-anchor="middle" font-family="Arial" font-size="9" fill="#548235">4/5 NM, axe piste, 2000' AGL</text>
  <text x="120" y="336" text-anchor="middle" font-family="Arial" font-size="9" fill="#548235">(arrivée chasse)</text>
  
  <!-- Numéro 4 -->
  <circle cx="100" cy="290" r="12" fill="#548235" stroke="white" stroke-width="2"/>
  <text x="100" y="294" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="white">4</text>
  
  <!-- ===================== -->
  <!-- 5 - FINAL (landing clearance) -->
  <!-- ===================== -->
  <circle cx="308" cy="205" r="14" fill="#1F3864" stroke="white" stroke-width="2"/>
  <text x="308" y="209" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="white">5</text>
  <text x="308" y="248" text-anchor="middle" font-family="Arial" font-size="9" fill="#1F3864" font-weight="bold">Seuil → Landing</text>
  <text x="308" y="260" text-anchor="middle" font-family="Arial" font-size="9" fill="#1F3864">clearance pour tous</text>

  <!-- === LÉGENDE === -->
  <rect x="540" y="20" width="165" height="148" fill="white" stroke="#CCC" stroke-width="1" rx="5" fill-opacity="0.95"/>
  <text x="622" y="38" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#1F3864">Types d'intégration</text>
  
  <line x1="552" y1="54" x2="582" y2="54" stroke="#2E75B6" stroke-width="2.5"/>
  <circle cx="590" cy="54" r="8" fill="#2E75B6"/>
  <text x="592" y="57" text-anchor="middle" font-size="8" font-weight="bold" fill="white">1</text>
  <text x="606" y="58" font-family="Arial" font-size="9.5" fill="#2E75B6">Downwind</text>
  
  <line x1="552" y1="74" x2="582" y2="74" stroke="#C00000" stroke-width="2.5"/>
  <circle cx="590" cy="74" r="8" fill="#C00000"/>
  <text x="592" y="77" text-anchor="middle" font-size="8" font-weight="bold" fill="white">2</text>
  <text x="606" y="78" font-family="Arial" font-size="9.5" fill="#C00000">Long final</text>
  
  <line x1="552" y1="94" x2="582" y2="94" stroke="#BF8F00" stroke-width="2.5"/>
  <circle cx="590" cy="94" r="8" fill="#BF8F00"/>
  <text x="592" y="97" text-anchor="middle" font-size="8" font-weight="bold" fill="white">3</text>
  <text x="606" y="98" font-family="Arial" font-size="9.5" fill="#BF8F00">Join base</text>
  
  <line x1="552" y1="114" x2="582" y2="114" stroke="#548235" stroke-width="2.5" stroke-dasharray="5,3"/>
  <circle cx="590" cy="114" r="8" fill="#548235"/>
  <text x="592" y="117" text-anchor="middle" font-size="8" font-weight="bold" fill="white">4</text>
  <text x="606" y="118" font-family="Arial" font-size="9.5" fill="#548235">Initial Point</text>
  <text x="606" y="128" font-family="Arial" font-size="8" fill="#548235">(chasse)</text>
  
  <circle cx="590" cy="144" r="8" fill="#1F3864"/>
  <text x="592" y="147" text-anchor="middle" font-size="8" font-weight="bold" fill="white">5</text>
  <text x="606" y="148" font-family="Arial" font-size="9.5" fill="#1F3864">Final →</text>
  <text x="606" y="160" font-family="Arial" font-size="8" fill="#1F3864">Landing clearance</text>

  <!-- Note -->
  <text x="400" y="390" text-anchor="middle" font-family="Arial" font-size="9.5" fill="#777" font-style="italic">Attribution du numéro dans le circuit (number in the circuit) : Downwind, Long final, Join base, Initial Point → puis landing clearance en final (pos. 5)</text>
</svg>
