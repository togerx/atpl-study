<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340">
  <!-- Background transparent -->
  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#1F3864">Priorités de passage — OACI Annexe 2</text>

  <!-- Balloons box -->
  <rect x="220" y="48" width="120" height="40" rx="8" fill="#E2EFDA" stroke="#548235" stroke-width="1.5"/>
  <text x="280" y="64" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#548235">🎈 Ballons</text>
  <text x="280" y="80" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#1F3864">priorité maximale</text>

  <!-- Arrow balloons -> gliders -->
  <line x1="280" y1="88" x2="280" y2="104" stroke="#1F3864" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Gliders box -->
  <rect x="220" y="106" width="120" height="40" rx="8" fill="#DEEAF6" stroke="#2E75B6" stroke-width="1.5"/>
  <text x="280" y="122" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#2E75B6">🪁 Planeurs</text>
  <text x="280" y="138" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#1F3864">cède aux ballons</text>

  <!-- Arrow gliders -> airships -->
  <line x1="280" y1="146" x2="280" y2="162" stroke="#1F3864" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Airships box -->
  <rect x="220" y="164" width="120" height="40" rx="8" fill="#DEEAF6" stroke="#2E75B6" stroke-width="1.5"/>
  <text x="280" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#2E75B6">🛸 Dirigeables</text>
  <text x="280" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#1F3864">cède aux ballons+planeurs</text>

  <!-- Arrow airships -> towing -->
  <line x1="280" y1="204" x2="280" y2="220" stroke="#1F3864" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Towing combo box -->
  <rect x="190" y="222" width="180" height="40" rx="8" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.5"/>
  <text x="280" y="238" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#BF8F00">✈️ Remorqueur + remorqué</text>
  <text x="280" y="254" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#1F3864">combo prioritaire sur tout motorisé</text>

  <!-- Arrow towing -> powered -->
  <line x1="280" y1="262" x2="280" y2="278" stroke="#1F3864" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Powered aircraft box -->
  <rect x="190" y="280" width="180" height="40" rx="8" fill="#FBE5E5" stroke="#C00000" stroke-width="1.5"/>
  <text x="280" y="296" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#C00000">🛩️ Aéronefs motorisés</text>
  <text x="280" y="312" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#1F3864">priorité minimale (cède à tous)</text>

  <!-- Right side note: aircraft on right -->
  <rect x="390" y="140" width="155" height="55" rx="8" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.5"/>
  <text x="467" y="158" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#BF8F00">Règle générale</text>
  <text x="467" y="173" text-anchor="middle" font-family="Arial,sans-serif" font-size="9.5" fill="#1F3864">Priorité à l'aéronef</text>
  <text x="467" y="187" text-anchor="middle" font-family="Arial,sans-serif" font-size="9.5" fill="#1F3864">venant de la droite</text>

  <!-- Left side note: overtaken -->
  <rect x="15" y="140" width="155" height="55" rx="8" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.5"/>
  <text x="92" y="158" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#BF8F00">Dépassement</text>
  <text x="92" y="173" text-anchor="middle" font-family="Arial,sans-serif" font-size="9.5" fill="#1F3864">L'aéronef dépassé</text>
  <text x="92" y="187" text-anchor="middle" font-family="Arial,sans-serif" font-size="9.5" fill="#1F3864">a la priorité</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1F3864"/>
    </marker>
  </defs>
</svg>
