<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360">
  <!-- === FOND VERT (terrain aérodrome) === -->
  <rect x="0" y="0" width="680" height="360" fill="#D8EFD4" stroke="none"/>
  
  <!-- === MOVEMENT AREA (contour global) === -->
  <rect x="30" y="30" width="620" height="300" fill="#C5E3C0" stroke="#548235" stroke-width="2" stroke-dasharray="8,4" rx="8"/>
  <text x="355" y="52" text-anchor="middle" font-family="Arial" font-size="12" fill="#548235" font-style="italic">MOVEMENT AREA (Manoeuvring + Apron)</text>
  
  <!-- === MANOEUVRING AREA === -->
  <!-- Piste principale -->
  <rect x="80" y="140" width="420" height="80" fill="#8A8A8A" stroke="#444" stroke-width="2" rx="3"/>
  <!-- Centerline -->
  <line x1="80" y1="180" x2="500" y2="180" stroke="white" stroke-width="2" stroke-dasharray="20,12"/>
  <!-- Marquages seuil gauche -->
  <rect x="85" y="148" width="12" height="9" fill="white" rx="1"/>
  <rect x="85" y="162" width="12" height="9" fill="white" rx="1"/>
  <rect x="85" y="200" width="12" height="9" fill="white" rx="1"/>
  <!-- Marquages seuil droit -->
  <rect x="490" y="148" width="12" height="9" fill="white" rx="1"/>
  <rect x="490" y="162" width="12" height="9" fill="white" rx="1"/>
  <rect x="490" y="200" width="12" height="9" fill="white" rx="1"/>
  <!-- Numéros de piste -->
  <text x="110" y="185" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">05</text>
  <text x="470" y="185" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">23</text>
  
  <!-- Taxiway A (parallèle piste, côté nord) -->
  <rect x="80" y="100" width="420" height="24" fill="#9B9B9B" stroke="#666" stroke-width="1"/>
  <line x1="80" y1="112" x2="500" y2="112" stroke="#F4C542" stroke-width="1.5" stroke-dasharray="12,8"/>
  <text x="290" y="110" text-anchor="middle" font-family="Arial" font-size="9" fill="#F4C542">TWY A</text>
  
  <!-- Taxiway B (perpendiculaire, accès) -->
  <rect x="490" y="100" width="24" height="120" fill="#9B9B9B" stroke="#666" stroke-width="1"/>
  <line x1="502" y1="100" x2="502" y2="220" stroke="#F4C542" stroke-width="1.5" stroke-dasharray="8,6"/>
  <text x="502" y="240" text-anchor="middle" font-family="Arial" font-size="9" fill="#444">TWY B</text>
  
  <!-- Taxiway C (vers apron) -->
  <rect x="490" y="220" width="80" height="24" fill="#9B9B9B" stroke="#666" stroke-width="1"/>
  <line x1="490" y1="232" x2="570" y2="232" stroke="#F4C542" stroke-width="1.5" stroke-dasharray="8,6"/>
  
  <!-- Label MANOEUVRING AREA -->
  <rect x="85" y="80" width="200" height="22" fill="#E2EFDA" stroke="#548235" stroke-width="1" rx="3" fill-opacity="0.85"/>
  <text x="185" y="95" text-anchor="middle" font-family="Arial" font-size="10" fill="#2E5C10" font-weight="bold">MANOEUVRING AREA</text>
  <text x="185" y="108" text-anchor="middle" font-family="Arial" font-size="9" fill="#555">(piste + taxiways — hors apron)</text>
  
  <!-- === APRON / TRAFFIC AREA === -->
  <rect x="555" y="140" width="90" height="180" fill="#C8C8C8" stroke="#777" stroke-width="2" rx="4"/>
  <text x="600" y="218" text-anchor="middle" font-family="Arial" font-size="11" fill="#444" font-weight="bold">APRON</text>
  <text x="600" y="232" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">(Traffic Area)</text>
  <!-- Avions stationnés -->
  <text x="568" y="170" font-family="Arial" font-size="18">✈</text>
  <text x="613" y="170" font-family="Arial" font-size="18">✈</text>
  <text x="568" y="195" font-family="Arial" font-size="18">✈</text>
  <!-- Terminal -->
  <rect x="555" y="300" width="90" height="35" fill="#A0C8E0" stroke="#2E75B6" stroke-width="1.5" rx="3"/>
  <text x="600" y="322" text-anchor="middle" font-family="Arial" font-size="9" fill="#1F3864" font-weight="bold">TERMINAL</text>
  
  <!-- Tour de contrôle -->
  <rect x="310" y="105" width="20" height="35" fill="#2E75B6" stroke="#1F3864" stroke-width="1.5"/>
  <rect x="305" y="97" width="30" height="14" fill="#2E75B6" stroke="#1F3864" stroke-width="1.5" rx="2"/>
  <text x="320" y="92" text-anchor="middle" font-family="Arial" font-size="9" fill="#1F3864" font-weight="bold">TWR</text>
  
  <!-- === HOLDING POSITION markers === -->
  <!-- Holding pos avant piste (côté ouest) -->
  <line x1="75" y1="135" x2="75" y2="225" stroke="#C00000" stroke-width="3" stroke-dasharray="10,4"/>
  <line x1="64" y1="135" x2="64" y2="225" stroke="#F4C542" stroke-width="2.5"/>
  <line x1="70" y1="135" x2="70" y2="225" stroke="#F4C542" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="55" y="182" text-anchor="middle" font-family="Arial" font-size="8" fill="#C00000" font-weight="bold" transform="rotate(-90 55 182)">HOLDING POSITION</text>
  
  <!-- === LÉGENDE === -->
  <rect x="30" y="265" width="230" height="82" fill="white" fill-opacity="0.9" stroke="#CCC" stroke-width="1" rx="5"/>
  <text x="40" y="282" font-family="Arial" font-size="11" font-weight="bold" fill="#1F3864">Zones OACI</text>
  
  <!-- Manoeuvring -->
  <rect x="40" y="290" width="20" height="12" fill="#8A8A8A" stroke="#444" stroke-width="1"/>
  <text x="65" y="301" font-family="Arial" font-size="10" fill="#333">Piste + Taxiways = Manoeuvring Area</text>
  <!-- Apron -->
  <rect x="40" y="308" width="20" height="12" fill="#C8C8C8" stroke="#777" stroke-width="1"/>
  <text x="65" y="319" font-family="Arial" font-size="10" fill="#333">Apron = Traffic Area</text>
  <!-- Movement -->
  <rect x="40" y="326" width="20" height="12" fill="#C5E3C0" stroke="#548235" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="65" y="337" font-family="Arial" font-size="10" fill="#333">Movement Area = Manoeuvring + Apron</text>

  <!-- AERODROME TRAFFIC label -->
  <rect x="30" y="335" width="0" height="0" fill="none"/>
  <text x="340" y="350" text-anchor="middle" font-family="Arial" font-size="10" fill="#777" font-style="italic">Aerodrome traffic = Manoeuvring Area + aircraft flying in vicinity of aerodrome</text>
</svg>
