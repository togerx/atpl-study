<svg viewBox="0 0 740 280" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <!-- Titre -->
  <text x="370" y="25" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F3864">Systèmes de transmission de pression</text>

  <!-- === COLONNE 1 : DIRECT === -->
  <!-- Header -->
  <rect x="20" y="40" width="210" height="35" rx="6" fill="#1F3864"/>
  <text x="125" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="white">📡 Direct Reading</text>

  <!-- Schéma -->
  <!-- Source -->
  <rect x="30" y="90" width="80" height="35" rx="5" fill="#DEEAF6" stroke="#2E75B6" stroke-width="1.5"/>
  <text x="70" y="112" text-anchor="middle" font-size="10" fill="#1F3864">Source P</text>
  <!-- Flèche + pipe -->
  <line x1="110" y1="107" x2="150" y2="107" stroke="#2E75B6" stroke-width="2"/>
  <text x="130" y="100" text-anchor="middle" font-size="8" fill="#555">tube</text>
  <!-- Indicateur -->
  <rect x="150" y="90" width="70" height="35" rx="5" fill="#E2EFDA" stroke="#548235" stroke-width="1.5"/>
  <text x="185" y="112" text-anchor="middle" font-size="10" fill="#1F3864">Jauge</text>

  <!-- + et − -->
  <text x="38" y="155" font-size="10" fill="#548235" font-weight="bold">✅ Simplicité, fiabilité</text>
  <text x="38" y="169" font-size="10" fill="#548235">✅ Pas d'alimentation élec.</text>
  <text x="38" y="186" font-size="10" fill="#C00000">⚠️ Risque de fuite</text>
  <text x="38" y="200" font-size="10" fill="#C00000">⚠️ Lag (retard de réponse)</text>

  <!-- Usage -->
  <rect x="20" y="220" width="210" height="40" rx="5" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1"/>
  <text x="125" y="238" text-anchor="middle" font-size="9" font-weight="bold" fill="#1F3864">Usage typique</text>
  <text x="125" y="253" text-anchor="middle" font-size="9" fill="#1F3864">P huile cockpit (Bourdon)</text>

  <!-- === COLONNE 2 : RELAY === -->
  <rect x="265" y="40" width="210" height="35" rx="6" fill="#1F3864"/>
  <text x="370" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="white">🔄 Relay System</text>

  <!-- Schéma -->
  <rect x="275" y="90" width="70" height="35" rx="5" fill="#DEEAF6" stroke="#2E75B6" stroke-width="1.5"/>
  <text x="310" y="112" text-anchor="middle" font-size="10" fill="#1F3864">Source P</text>
  <line x1="345" y1="107" x2="370" y2="107" stroke="#2E75B6" stroke-width="1.5"/>
  <!-- Relay box -->
  <rect x="370" y="93" width="40" height="28" rx="4" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.5"/>
  <text x="390" y="111" text-anchor="middle" font-size="8" fill="#1F3864">Relay</text>
  <line x1="410" y1="107" x2="440" y2="107" stroke="#2E75B6" stroke-width="1.5"/>
  <rect x="440" y="90" width="25" height="35" rx="5" fill="#E2EFDA" stroke="#548235" stroke-width="1.5"/>
  <text x="452" y="112" text-anchor="middle" font-size="8" fill="#1F3864">J</text>

  <text x="278" y="155" font-size="10" fill="#548235" font-weight="bold">✅ Plus rapide</text>
  <text x="278" y="169" font-size="10" fill="#548235">✅ Moins de fuites</text>
  <text x="278" y="186" font-size="10" fill="#C00000">⚠️ Tuyauteries complexes</text>
  <text x="278" y="200" font-size="10" fill="#C00000">⚠️ Relay mécanique</text>

  <rect x="265" y="220" width="210" height="40" rx="5" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1"/>
  <text x="370" y="238" text-anchor="middle" font-size="9" font-weight="bold" fill="#1F3864">Usage typique</text>
  <text x="370" y="253" text-anchor="middle" font-size="9" fill="#1F3864">Systèmes intermédiaires</text>

  <!-- === COLONNE 3 : ELECTRIC === -->
  <rect x="510" y="40" width="210" height="35" rx="6" fill="#1F3864"/>
  <text x="615" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="white">⚡ Electric / Remote</text>

  <!-- Schéma -->
  <rect x="520" y="90" width="60" height="35" rx="5" fill="#DEEAF6" stroke="#2E75B6" stroke-width="1.5"/>
  <text x="550" y="108" text-anchor="middle" font-size="9" fill="#1F3864">Capteur</text>
  <text x="550" y="120" text-anchor="middle" font-size="8" fill="#1F3864">(SSS)</text>
  <!-- Signal -->
  <line x1="580" y1="107" x2="605" y2="107" stroke="#C00000" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="592" y="100" text-anchor="middle" font-size="7" fill="#C00000">4-20mA</text>
  <!-- Transducteur -->
  <rect x="605" y="93" width="40" height="28" rx="4" fill="#FBE5E5" stroke="#C00000" stroke-width="1.5"/>
  <text x="625" y="111" text-anchor="middle" font-size="7" fill="#1F3864">Trans-</text>
  <text x="625" y="121" text-anchor="middle" font-size="7" fill="#1F3864">ducteur</text>
  <line x1="645" y1="107" x2="670" y2="107" stroke="#C00000" stroke-width="1.5" stroke-dasharray="4,2"/>
  <rect x="670" y="90" width="30" height="35" rx="5" fill="#E2EFDA" stroke="#548235" stroke-width="1.5"/>
  <text x="685" y="112" text-anchor="middle" font-size="8" fill="#1F3864">ECAM</text>

  <text x="523" y="155" font-size="10" fill="#548235" font-weight="bold">✅ Simple, numérique</text>
  <text x="523" y="169" font-size="10" fill="#548235">✅ Très rapide, précis</text>
  <text x="523" y="186" font-size="10" fill="#C00000">⚠️ Besoin alimentation</text>
  <text x="523" y="200" font-size="10" fill="#C00000">⚠️ Erreurs électriques</text>

  <rect x="510" y="220" width="210" height="40" rx="5" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1"/>
  <text x="615" y="238" text-anchor="middle" font-size="9" font-weight="bold" fill="#1F3864">Usage typique</text>
  <text x="615" y="253" text-anchor="middle" font-size="9" fill="#1F3864">ECAM, ADIRU, systèmes modernes</text>

  <!-- Séparateurs -->
  <line x1="252" y1="35" x2="252" y2="270" stroke="#ddd" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="498" y1="35" x2="498" y2="270" stroke="#ddd" stroke-width="1" stroke-dasharray="5,3"/>

</svg>
