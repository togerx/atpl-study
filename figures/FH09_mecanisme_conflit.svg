<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 350" width="100%" height="100%">
  <!-- Section GAUCHE : Signaux Sensoriels -->
  <rect x="20" y="80" width="180" height="160" rx="6" fill="#DEEAF6" stroke="#2E75B6" stroke-width="2"/>
  <text x="110" y="105" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1F3864" text-anchor="middle">Signaux Sensoriels</text>
  <text x="35" y="135" font-family="Arial, sans-serif" font-size="10" fill="#333333">• Vision (Réel / Virtuel)</text>
  <text x="35" y="160" font-family="Arial, sans-serif" font-size="10" fill="#333333">• Système Vestibulaire</text>
  <text x="35" y="185" font-family="Arial, sans-serif" font-size="10" fill="#333333">• Proprioception (Muscles)</text>
  <text x="35" y="210" font-family="Arial, sans-serif" font-size="10" fill="#333333">• Système Gastro-intestinal</text>

  <!-- Flèche : Entrées -> Comparaison -->
  <line x1="200" y1="160" x2="230" y2="160" stroke="#1F3864" stroke-width="2"/>
  <polygon points="230,160 222,155 222,165" fill="#1F3864"/>

  <!-- Section CENTRE : Comparateur central -->
  <rect x="240" y="120" width="160" height="80" rx="6" fill="#FFF2CC" stroke="#BF8F00" stroke-width="2"/>
  <text x="320" y="145" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1F3864" text-anchor="middle">COMPARAISON</text>
  <text x="320" y="165" font-family="Arial, sans-serif" font-size="9.5" fill="#555555" text-anchor="middle">Modèle Attendu (Mémoire)</text>
  <text x="320" y="180" font-family="Arial, sans-serif" font-size="9.5" fill="#555555" text-anchor="middle">vs Signaux Perçus</text>

  <!-- Double Flèche Verticale : Comparaison <-> Expérience Acquise -->
  <line x1="320" y1="75" x2="320" y2="115" stroke="#1F3864" stroke-width="1.5"/>
  <polygon points="320,75 316,83 324,83" fill="#1F3864"/>
  <polygon points="320,115 316,107 324,107" fill="#1F3864"/>

  <!-- Section HAUT : Expérience Acquise -->
  <rect x="230" y="20" width="180" height="40" rx="5" fill="#E2EFDA" stroke="#548235" stroke-width="1.5"/>
  <text x="320" y="44" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1F3864" text-anchor="middle">Expérience Acquise (Habituation)</text>

  <!-- Flèche : Comparaison -> Divergence -->
  <line x1="400" y1="160" x2="430" y2="160" stroke="#1F3864" stroke-width="2"/>
  <polygon points="430,160 422,155 422,165" fill="#1F3864"/>

  <!-- Section DROITE : Divergence / Conflit -->
  <rect x="440" y="120" width="180" height="80" rx="6" fill="#FBE5E5" stroke="#C00000" stroke-width="2"/>
  <text x="530" y="145" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#C00000" text-anchor="middle">DIVERGENCE</text>
  <text x="530" y="165" font-family="Arial, sans-serif" font-size="10" fill="#1F3864" text-anchor="middle" font-weight="bold">Conflit Sensoriel</text>
  <text x="530" y="180" font-family="Arial, sans-serif" font-size="9" fill="#555555" text-anchor="middle">(Mismatch aigu)</text>

  <!-- Flèche : Divergence -> Cinétose -->
  <line x1="530" y1="200" x2="530" y2="235" stroke="#C00000" stroke-width="2"/>
  <polygon points="530,235 525,227 535,227" fill="#C00000"/>

  <!-- Section BAS DROITE : Cinétose active -->
  <rect x="440" y="240" width="180" height="50" rx="6" fill="#C00000" stroke="#C00000" stroke-width="1"/>
  <text x="530" y="270" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CINÉTOSE</text>
  
  <!-- Courbe de rétroaction : Mise à jour de la mémoire à long terme -->
  <path d="M 530,120 Q 450,65 390,45" fill="none" stroke="#548235" stroke-width="1.5" stroke-dasharray="4,4"/>
  <polygon points="390,45 399,44 396,52" fill="#548235"/>
  <text x="475" y="45" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#548235" text-anchor="middle">Création d'un nouveau modèle</text>
</svg>
