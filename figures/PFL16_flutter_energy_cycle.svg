<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <!-- Titre -->
  <text x="350" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F3864">Cycle d'énergie du flutter — l'air fait un travail positif sur la structure à chaque cycle</text>

  <!-- Flèches de cycle (cercle directionnel) -->
  <!-- Flèche droite (1→2) -->
  <path d="M 195 110 Q 350 70 505 110" stroke="#1F3864" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <!-- Flèche gauche (3→4) -->
  <path d="M 505 230 Q 350 270 195 230" stroke="#1F3864" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <!-- Flèche bas droite (2→3) -->
  <line x1="540" y1="140" x2="540" y2="200" stroke="#1F3864" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Flèche haut gauche (4→1) -->
  <line x1="160" y1="200" x2="160" y2="140" stroke="#1F3864" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Définition flèche -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1F3864"/>
    </marker>
  </defs>

  <!-- Boîte 1 — Aile monte -->
  <rect x="10" y="80" width="185" height="75" rx="6" fill="#E2EFDA" stroke="#548235" stroke-width="1.5"/>
  <text x="102" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#375623">① Aile monte</text>
  <text x="102" y="117" text-anchor="middle" font-size="10.5" fill="#375623">Torsion nez en haut</text>
  <text x="102" y="131" text-anchor="middle" font-size="10.5" fill="#375623">→ incidence ↑ → portance ↑</text>
  <text x="102" y="146" text-anchor="middle" font-size="10" fill="#C00000" font-weight="bold">Force vers le HAUT</text>

  <!-- Boîte 2 — Force amplifie -->
  <rect x="505" y="80" width="185" height="75" rx="6" fill="#DEEAF6" stroke="#2E75B6" stroke-width="1.5"/>
  <text x="597" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F3864">② Force amplifiée</text>
  <text x="597" y="117" text-anchor="middle" font-size="10.5" fill="#1F3864">La portance ↑ pousse</text>
  <text x="597" y="131" text-anchor="middle" font-size="10.5" fill="#1F3864">dans le même sens</text>
  <text x="597" y="146" text-anchor="middle" font-size="10" fill="#C00000" font-weight="bold">= travail positif</text>

  <!-- Boîte 3 — Aile descend -->
  <rect x="505" y="195" width="185" height="75" rx="6" fill="#FBE5E5" stroke="#C00000" stroke-width="1.5"/>
  <text x="597" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#C00000">③ Aile descend</text>
  <text x="597" y="232" text-anchor="middle" font-size="10.5" fill="#7B0000">Torsion nez en bas</text>
  <text x="597" y="246" text-anchor="middle" font-size="10.5" fill="#7B0000">→ incidence ↓ → portance ↓</text>
  <text x="597" y="261" text-anchor="middle" font-size="10" fill="#C00000" font-weight="bold">Force vers le BAS</text>

  <!-- Boîte 4 — Force amplifie encore -->
  <rect x="10" y="195" width="185" height="75" rx="6" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.5"/>
  <text x="102" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#7F5500">④ Force amplifiée</text>
  <text x="102" y="232" text-anchor="middle" font-size="10.5" fill="#7F5500">La portance ↓ pousse</text>
  <text x="102" y="246" text-anchor="middle" font-size="10.5" fill="#7F5500">dans le même sens</text>
  <text x="102" y="261" text-anchor="middle" font-size="10" fill="#C00000" font-weight="bold">= travail positif</text>

  <!-- Label central -->
  <rect x="255" y="130" width="190" height="80" rx="8" fill="#1F3864"/>
  <text x="350" y="158" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFD700">RÉSULTAT NET :</text>
  <text x="350" y="175" text-anchor="middle" font-size="10.5" fill="white">L'air apporte de l'énergie</text>
  <text x="350" y="191" text-anchor="middle" font-size="10.5" fill="white">à chaque cycle</text>
  <text x="350" y="206" text-anchor="middle" font-size="10" fill="#FF9999">→ amplitude divergente</text>

  <!-- Note bas -->
  <text x="350" y="310" text-anchor="middle" font-size="9.5" fill="#555">Condition requise : vitesse ≥ V_flutter (l'amortissement aérodynamique devient négatif)</text>
  <text x="350" y="326" text-anchor="middle" font-size="9.5" fill="#555">Ce n'est PAS une simple résonance — il faut 2 modes couplés + décalage de phase</text>
</svg>
