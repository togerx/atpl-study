<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 370" width="700" height="370">
  <!-- FH06 Amétropies - 3 schémas : myopie, hypermétropie, astigmatisme -->
  <!-- Espacement : 3 colonnes de ~220px -->

  <defs>
    <marker id="arrowRed" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#C00000"/>
    </marker>
    <marker id="arrowGreen" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#548235"/>
    </marker>
    <marker id="arrowBlue" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#2E75B6"/>
    </marker>
  </defs>

  <!-- === MYOPIE === (colonne 1, centre x=117) -->
  <rect x="10" y="10" width="214" height="350" rx="8" fill="#FBE5E5" stroke="#C00000" stroke-width="1.5"/>
  <rect x="10" y="10" width="214" height="36" rx="8" fill="#C00000"/>
  <text x="117" y="33" font-family="Arial" font-size="13" fill="white" font-weight="bold" text-anchor="middle">MYOPIE</text>

  <!-- Globe myope (axe allongé) -->
  <ellipse cx="117" cy="145" rx="72" ry="62" fill="#f0e8e0" stroke="#8a7a6a" stroke-width="2"/>
  <ellipse cx="117" cy="145" rx="63" ry="54" fill="#e0f0e8" fill-opacity="0.6"/>
  <!-- Cornée myope -->
  <path d="M 48,120 Q 30,145 48,170" fill="#c8e8f4" fill-opacity="0.4" stroke="#6ab8d4" stroke-width="2"/>
  <!-- Axe optique myope -->
  <line x1="28" y1="145" x2="180" y2="145" stroke="#1F3864" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.4"/>
  <!-- Rayons lumineux — convergence AVANT la rétine -->
  <line x1="28" y1="115" x2="68" y2="132" stroke="#C00000" stroke-width="1.5" opacity="0.7"/>
  <line x1="28" y1="175" x2="68" y2="158" stroke="#C00000" stroke-width="1.5" opacity="0.7"/>
  <line x1="68" y1="132" x2="130" y2="145" stroke="#C00000" stroke-width="1.5" opacity="0.7"/>
  <line x1="68" y1="158" x2="130" y2="145" stroke="#C00000" stroke-width="1.5" opacity="0.7"/>
  <!-- Point de convergence (AVANT la rétine) -->
  <circle cx="130" cy="145" r="4" fill="#C00000"/>
  <!-- Ligne pointillée vers rétine -->
  <line x1="130" y1="145" x2="175" y2="145" stroke="#C00000" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- Texte descriptif myopie -->
  <text x="117" y="228" font-family="Arial" font-size="10.5" fill="#1F3864" text-anchor="middle">Image formée</text>
  <text x="117" y="242" font-family="Arial" font-size="10.5" fill="#C00000" font-weight="bold" text-anchor="middle">en avant de la rétine</text>
  <line x1="30" y1="258" x2="200" y2="258" stroke="#C00000" stroke-width="1" stroke-dasharray="3,2" opacity="0.4"/>
  <text x="117" y="275" font-family="Arial" font-size="10.5" fill="#1F3864" text-anchor="middle">Correction :</text>
  <text x="117" y="291" font-family="Arial" font-size="11" fill="#548235" font-weight="bold" text-anchor="middle">Verre divergent (concave)</text>
  <!-- Chip valeur -->
  <rect x="35" y="308" width="164" height="24" rx="5" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.2"/>
  <text x="117" y="324" font-family="Arial" font-size="10.5" fill="#BF8F00" font-weight="bold" text-anchor="middle">Vision lointaine réduite</text>

  <!-- === HYPERMÉTROPIE === (colonne 2, centre x=350) -->
  <rect x="243" y="10" width="214" height="350" rx="8" fill="#DEEAF6" stroke="#2E75B6" stroke-width="1.5"/>
  <rect x="243" y="10" width="214" height="36" rx="8" fill="#2E75B6"/>
  <text x="350" y="33" font-family="Arial" font-size="13" fill="white" font-weight="bold" text-anchor="middle">HYPERMÉTROPIE</text>

  <!-- Globe hypermétrope (axe court) -->
  <ellipse cx="350" cy="145" rx="62" ry="62" fill="#f0e8e0" stroke="#8a7a6a" stroke-width="2"/>
  <ellipse cx="350" cy="145" rx="54" ry="54" fill="#e0f0f8" fill-opacity="0.6"/>
  <!-- Cornée -->
  <path d="M 291,120 Q 274,145 291,170" fill="#c8e8f4" fill-opacity="0.4" stroke="#6ab8d4" stroke-width="2"/>
  <!-- Axe optique -->
  <line x1="264" y1="145" x2="410" y2="145" stroke="#1F3864" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.4"/>
  <!-- Rayons — convergence APRÈS la rétine -->
  <line x1="264" y1="118" x2="295" y2="132" stroke="#2E75B6" stroke-width="1.5" opacity="0.7"/>
  <line x1="264" y1="172" x2="295" y2="158" stroke="#2E75B6" stroke-width="1.5" opacity="0.7"/>
  <line x1="295" y1="132" x2="395" y2="145" stroke="#2E75B6" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="295" y1="158" x2="395" y2="145" stroke="#2E75B6" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.5"/>
  <!-- Point de convergence après la rétine -->
  <circle cx="415" cy="145" r="4" fill="#2E75B6"/>
  <!-- Rétine ligne -->
  <line x1="400" y1="118" x2="400" y2="172" stroke="#8a7a6a" stroke-width="1.5"/>
  <!-- Point sur rétine (flou) -->
  <circle cx="400" cy="145" r="5" fill="none" stroke="#2E75B6" stroke-width="1.5" stroke-dasharray="2,2"/>

  <!-- Texte descriptif -->
  <text x="350" y="228" font-family="Arial" font-size="10.5" fill="#1F3864" text-anchor="middle">Image formée</text>
  <text x="350" y="242" font-family="Arial" font-size="10.5" fill="#2E75B6" font-weight="bold" text-anchor="middle">en arrière de la rétine</text>
  <line x1="263" y1="258" x2="433" y2="258" stroke="#2E75B6" stroke-width="1" stroke-dasharray="3,2" opacity="0.4"/>
  <text x="350" y="275" font-family="Arial" font-size="10.5" fill="#1F3864" text-anchor="middle">Correction :</text>
  <text x="350" y="291" font-family="Arial" font-size="11" fill="#548235" font-weight="bold" text-anchor="middle">Verre convergent (convexe)</text>
  <rect x="268" y="308" width="164" height="24" rx="5" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.2"/>
  <text x="350" y="324" font-family="Arial" font-size="10.5" fill="#BF8F00" font-weight="bold" text-anchor="middle">Vision rapprochée réduite</text>

  <!-- === ASTIGMATISME === (colonne 3, centre x=583) -->
  <rect x="476" y="10" width="214" height="350" rx="8" fill="#E2EFDA" stroke="#548235" stroke-width="1.5"/>
  <rect x="476" y="10" width="214" height="36" rx="8" fill="#548235"/>
  <text x="583" y="33" font-family="Arial" font-size="13" fill="white" font-weight="bold" text-anchor="middle">ASTIGMATISME</text>

  <!-- Globe astigmate (non parfaitement sphérique) -->
  <ellipse cx="583" cy="145" rx="66" ry="62" fill="#f0e8e0" stroke="#8a7a6a" stroke-width="2"/>
  <ellipse cx="583" cy="145" rx="57" ry="54" fill="#e8f0e0" fill-opacity="0.6"/>
  <!-- Cornée légèrement irrégulière -->
  <path d="M 520,118 Q 500,145 520,172" fill="#c8e8f4" fill-opacity="0.4" stroke="#6ab8d4" stroke-width="2"/>
  <!-- Axe optique -->
  <line x1="497" y1="145" x2="645" y2="145" stroke="#1F3864" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.4"/>
  <!-- Rayons — points focaux différents -->
  <line x1="497" y1="115" x2="530" y2="130" stroke="#548235" stroke-width="1.5" opacity="0.7"/>
  <line x1="497" y1="175" x2="530" y2="160" stroke="#548235" stroke-width="1.5" opacity="0.7"/>
  <line x1="530" y1="130" x2="580" y2="141" stroke="#548235" stroke-width="1.5" opacity="0.6"/>
  <line x1="530" y1="160" x2="580" y2="149" stroke="#548235" stroke-width="1.5" opacity="0.6"/>
  <!-- Foyer 1 -->
  <circle cx="580" cy="141" r="3" fill="#548235"/>
  <!-- Foyer 2 -->
  <circle cx="580" cy="149" r="3" fill="#C00000"/>
  <!-- Pastilles foyers -->
  <text x="622" y="138" font-family="Arial" font-size="9" fill="#548235">F1</text>
  <text x="622" y="154" font-family="Arial" font-size="9" fill="#C00000">F2</text>

  <!-- Texte descriptif -->
  <text x="583" y="228" font-family="Arial" font-size="10.5" fill="#1F3864" text-anchor="middle">Cornée non parfaitement</text>
  <text x="583" y="242" font-family="Arial" font-size="10.5" fill="#548235" font-weight="bold" text-anchor="middle">sphérique → 2 foyers</text>
  <line x1="496" y1="258" x2="666" y2="258" stroke="#548235" stroke-width="1" stroke-dasharray="3,2" opacity="0.4"/>
  <text x="583" y="275" font-family="Arial" font-size="10.5" fill="#1F3864" text-anchor="middle">Correction :</text>
  <text x="583" y="291" font-family="Arial" font-size="11" fill="#548235" font-weight="bold" text-anchor="middle">Verre torique (cylindrique)</text>
  <rect x="501" y="308" width="164" height="24" rx="5" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.2"/>
  <text x="583" y="324" font-family="Arial" font-size="10.5" fill="#BF8F00" font-weight="bold" text-anchor="middle">Vision floue à toutes distances</text>
</svg>
