<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">
  <!-- Background -->
  <rect width="720" height="420" fill="transparent"/>

  <!-- Title -->
  <text x="360" y="28" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1F3864" text-anchor="middle">Services de la Circulation Aérienne (ATS) — Structure</text>

  <!-- Root box: ATS -->
  <!-- x=285, y=45, w=150, h=44 -->
  <rect x="285" y="45" width="150" height="44" rx="6" fill="#DEEAF6" stroke="#2E75B6" stroke-width="1.5"/>
  <text x="360" y="63" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1F3864" text-anchor="middle">ATS</text>
  <text x="360" y="80" font-family="Arial, sans-serif" font-size="10" fill="#1F3864" text-anchor="middle">Air Traffic Services</text>

  <!-- Arrows from ATS to 3 children -->
  <!-- ATC branch: center x=160 -->
  <line x1="285" y1="67" x2="160" y2="67" stroke="#1F3864" stroke-width="1.2"/>
  <line x1="160" y1="67" x2="160" y2="130" stroke="#1F3864" stroke-width="1.2"/>
  <polygon points="160,130 156,122 164,122" fill="#1F3864"/>

  <!-- FIS branch: center x=360 -->
  <line x1="360" y1="89" x2="360" y2="130" stroke="#1F3864" stroke-width="1.2"/>
  <polygon points="360,130 356,122 364,122" fill="#1F3864"/>

  <!-- Advisory branch: center x=560 -->
  <line x1="435" y1="67" x2="560" y2="67" stroke="#1F3864" stroke-width="1.2"/>
  <line x1="560" y1="67" x2="560" y2="130" stroke="#1F3864" stroke-width="1.2"/>
  <polygon points="560,130 556,122 564,122" fill="#1F3864"/>

  <!-- ATC box: x=80, y=130, w=160, h=44 -->
  <rect x="80" y="130" width="160" height="44" rx="6" fill="#E2EFDA" stroke="#548235" stroke-width="1.5"/>
  <text x="160" y="148" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1F3864" text-anchor="middle">ATC</text>
  <text x="160" y="165" font-family="Arial, sans-serif" font-size="9.5" fill="#1F3864" text-anchor="middle">Air Traffic Control</text>

  <!-- FIS box: x=280, y=130, w=160, h=44 -->
  <rect x="280" y="130" width="160" height="44" rx="6" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.5"/>
  <text x="360" y="148" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1F3864" text-anchor="middle">FIS</text>
  <text x="360" y="165" font-family="Arial, sans-serif" font-size="9.5" fill="#1F3864" text-anchor="middle">Flight Information Service</text>

  <!-- Advisory box: x=480, y=130, w=160, h=44 -->
  <rect x="480" y="130" width="160" height="44" rx="6" fill="#FBE5E5" stroke="#C00000" stroke-width="1.5"/>
  <text x="560" y="148" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1F3864" text-anchor="middle">Advisory Service</text>
  <text x="560" y="165" font-family="Arial, sans-serif" font-size="9.5" fill="#1F3864" text-anchor="middle">Service consultatif</text>

  <!-- Divider line -->
  <line x1="30" y1="200" x2="690" y2="200" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Second level: FIS branches -->
  <!-- Arrow FIS → AFIS -->
  <line x1="320" y1="174" x2="200" y2="174" stroke="#BF8F00" stroke-width="1.2"/>
  <line x1="200" y1="174" x2="200" y2="215" stroke="#BF8F00" stroke-width="1.2"/>
  <polygon points="200,215 196,207 204,207" fill="#BF8F00"/>

  <!-- Arrow FIS → ATIS -->
  <line x1="400" y1="174" x2="520" y2="174" stroke="#BF8F00" stroke-width="1.2"/>
  <line x1="520" y1="174" x2="520" y2="215" stroke="#BF8F00" stroke-width="1.2"/>
  <polygon points="520,215 516,207 524,207" fill="#BF8F00"/>

  <!-- Arrow FIS → FIS en route (center) -->
  <line x1="360" y1="174" x2="360" y2="215" stroke="#BF8F00" stroke-width="1.2"/>
  <polygon points="360,215 356,207 364,207" fill="#BF8F00"/>

  <!-- AFIS box: x=120, y=215, w=160, h=44 -->
  <rect x="120" y="215" width="160" height="44" rx="6" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.2"/>
  <text x="200" y="233" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1F3864" text-anchor="middle">AFIS</text>
  <text x="200" y="250" font-family="Arial, sans-serif" font-size="9" fill="#1F3864" text-anchor="middle">Aerodrome FIS</text>

  <!-- FIS en route box: x=280, y=215, w=160, h=44 -->
  <rect x="280" y="215" width="160" height="44" rx="6" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.2"/>
  <text x="360" y="233" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1F3864" text-anchor="middle">FIS en route</text>
  <text x="360" y="250" font-family="Arial, sans-serif" font-size="9" fill="#1F3864" text-anchor="middle">Classes E, F, G</text>

  <!-- ATIS box: x=440, y=215, w=160, h=44 -->
  <rect x="440" y="215" width="160" height="44" rx="6" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.2"/>
  <text x="520" y="233" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1F3864" text-anchor="middle">ATIS</text>
  <text x="520" y="250" font-family="Arial, sans-serif" font-size="9" fill="#1F3864" text-anchor="middle">Automatic Terminal IS</text>

  <!-- Priority note -->
  <!-- Arrow priority ATC over FIS -->
  <rect x="30" y="295" width="660" height="55" rx="6" fill="#FBE5E5" stroke="#C00000" stroke-width="1.2"/>
  <text x="360" y="316" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#C00000" text-anchor="middle">⚠ Priorité : ATC prend le dessus sur le FIS</text>
  <text x="360" y="333" font-family="Arial, sans-serif" font-size="9.5" fill="#1F3864" text-anchor="middle">Quand un contrôleur fournit l'ATC, il a priorité sur la fourniture du FIS.</text>
  <text x="360" y="349" font-family="Arial, sans-serif" font-size="9.5" fill="#1F3864" text-anchor="middle">L'Advisory Service est réservé à l'espace aérien de classe F (IFR, sur demande).</text>

  <!-- FIS beneficiaries note -->
  <rect x="30" y="365" width="310" height="44" rx="6" fill="#DEEAF6" stroke="#2E75B6" stroke-width="1.2"/>
  <text x="185" y="383" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1F3864" text-anchor="middle">FIS fourni à :</text>
  <text x="185" y="400" font-family="Arial, sans-serif" font-size="9" fill="#1F3864" text-anchor="middle">Vols sous ATC + vols connus des unités ATS (contact radio)</text>

  <!-- Advisory note -->
  <rect x="380" y="365" width="310" height="44" rx="6" fill="#FBE5E5" stroke="#C00000" stroke-width="1.2"/>
  <text x="535" y="383" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1F3864" text-anchor="middle">Advisory — suggestions, non instructions</text>
  <text x="535" y="400" font-family="Arial, sans-serif" font-size="9" fill="#1F3864" text-anchor="middle">Le pilote décide ; doit informer l'ATS de sa décision</text>
</svg>
