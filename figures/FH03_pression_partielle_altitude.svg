<svg viewBox="0 0 500 260" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <!-- Oxygen supply requirements by altitude range -->
  <rect x="0" y="0" width="500" height="260" fill="#F8F9FA" rx="8"/>
  <text x="250" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F3864">Besoins en oxygène selon l'altitude</text>

  <!-- Arrow line -->
  <line x1="50" y1="235" x2="50" y2="48" stroke="#1F3864" stroke-width="2"/>
  <polygon points="50,40 44,56 56,56" fill="#1F3864"/>
  <text x="50" y="248" text-anchor="middle" font-size="10" fill="#444">Altitude (ft)</text>

  <!-- Zone bands -->
  <!-- Zone 1: 0 - 10,000 ft (air only) — y: 195 to 170 (25px) -->
  <rect x="80" y="195" width="380" height="40" fill="#E2EFDA" stroke="#548235" stroke-width="1.5" rx="4"/>
  <text x="270" y="211" text-anchor="middle" font-size="11" font-weight="bold" fill="#548235">0 – 10 000 ft</text>
  <text x="270" y="227" text-anchor="middle" font-size="10.5" fill="#333">Air ambiant — aucun supplément d'O₂ nécessaire</text>

  <!-- Zone 2: 10,000 - 33,700 ft — y: 145 to 195 -->
  <rect x="80" y="143" width="380" height="50" fill="#DEEAF6" stroke="#2E75B6" stroke-width="1.5" rx="4"/>
  <text x="270" y="162" text-anchor="middle" font-size="11" font-weight="bold" fill="#2E75B6">10 000 – 33 700 ft</text>
  <text x="270" y="178" text-anchor="middle" font-size="10.5" fill="#333">Mélange O₂/Air — enrichissement progressif</text>
  <text x="270" y="191" text-anchor="middle" font-size="9.5" fill="#555">Maintien pO₂ alvéolaire ≥ 103 mmHg (= niveau sol)</text>

  <!-- Zone 3: 33,700 - 40,000 ft — y: 95 to 143 -->
  <rect x="80" y="95" width="380" height="46" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.5" rx="4"/>
  <text x="270" y="114" text-anchor="middle" font-size="11" font-weight="bold" fill="#BF8F00">33 700 – 40 000 ft</text>
  <text x="270" y="130" text-anchor="middle" font-size="10.5" fill="#333">100% oxygène pur</text>
  <text x="270" y="143" text-anchor="middle" font-size="9" fill="#666">Seuil où 100% O₂ est requis pour maintenir la pression alvéolaire</text>

  <!-- Zone 4: above 40,000 ft — y: 50 to 95 -->
  <rect x="80" y="50" width="380" height="43" fill="#FBE5E5" stroke="#C00000" stroke-width="1.5" rx="4"/>
  <text x="270" y="68" text-anchor="middle" font-size="11" font-weight="bold" fill="#C00000">Au-dessus de 40 000 ft</text>
  <text x="270" y="84" text-anchor="middle" font-size="10.5" fill="#333">100% O₂ sous pression (pressure breathing)</text>
  <text x="270" y="91" text-anchor="middle" font-size="9" fill="#666">Utilisé quasi exclusivement par les opérateurs militaires</text>

  <!-- Altitude markers on Y axis -->
  <text x="72" y="238" text-anchor="end" font-size="9" fill="#444">0</text>
  <text x="72" y="199" text-anchor="end" font-size="9" fill="#444">10 000</text>
  <text x="72" y="149" text-anchor="end" font-size="9" fill="#444">33 700</text>
  <text x="72" y="99" text-anchor="end" font-size="9" fill="#444">40 000</text>
  <text x="72" y="55" text-anchor="end" font-size="9" fill="#444">+ haut</text>

  <!-- tick marks -->
  <line x1="50" y1="235" x2="56" y2="235" stroke="#1F3864" stroke-width="1"/>
  <line x1="50" y1="195" x2="56" y2="195" stroke="#1F3864" stroke-width="1"/>
  <line x1="50" y1="143" x2="56" y2="143" stroke="#1F3864" stroke-width="1"/>
  <line x1="50" y1="95" x2="56" y2="95" stroke="#1F3864" stroke-width="1"/>
  <line x1="50" y1="50" x2="56" y2="50" stroke="#1F3864" stroke-width="1"/>
</svg>
