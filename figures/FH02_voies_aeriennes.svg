<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" width="660" height="360">
  <rect width="660" height="360" fill="#F8F9FA" rx="8"/>
  <text x="330" y="28" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1F3864">Respiratory Airways</text>

  <!-- UPPER AIRWAY column -->
  <rect x="30" y="45" width="180" height="30" rx="6" fill="#1F3864"/>
  <text x="120" y="65" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="white">UPPER AIRWAY</text>

  <rect x="30" y="85" width="180" height="55" rx="6" fill="#DEEAF6" stroke="#2E75B6" stroke-width="1.5"/>
  <text x="120" y="104" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#1F3864">Nasal pits &amp; Mouth</text>
  <text x="120" y="120" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#333">Filter inhaled air</text>
  <text x="120" y="133" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#333">Perceive odors</text>

  <!-- Arrow down -->
  <line x1="120" y1="140" x2="120" y2="158" stroke="#1F3864" stroke-width="2"/>
  <polygon points="120,162 115,153 125,153" fill="#1F3864"/>

  <!-- LOWER AIRWAY column -->
  <rect x="30" y="168" width="180" height="30" rx="6" fill="#2E75B6"/>
  <text x="120" y="188" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="white">LOWER AIRWAY</text>

  <!-- Pharynx -->
  <rect x="30" y="205" width="180" height="38" rx="5" fill="#DEEAF6" stroke="#2E75B6" stroke-width="1.2"/>
  <text x="120" y="220" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2E75B6">Pharynx</text>
  <text x="120" y="235" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" fill="#333">Breathing + digestion</text>
  <line x1="120" y1="243" x2="120" y2="250" stroke="#2E75B6" stroke-width="1.5"/>
  <polygon points="120,254 115,247 125,247" fill="#2E75B6"/>

  <!-- Larynx -->
  <rect x="30" y="254" width="180" height="38" rx="5" fill="#DEEAF6" stroke="#2E75B6" stroke-width="1.2"/>
  <text x="120" y="269" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2E75B6">Larynx</text>
  <text x="120" y="284" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" fill="#333">Vocal cords + pharynx-trachea link</text>
  <line x1="120" y1="292" x2="120" y2="299" stroke="#2E75B6" stroke-width="1.5"/>
  <polygon points="120,303 115,296 125,296" fill="#2E75B6"/>

  <!-- Trachea -->
  <rect x="30" y="303" width="180" height="30" rx="5" fill="#DEEAF6" stroke="#2E75B6" stroke-width="1.2"/>
  <text x="120" y="318" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2E75B6">Trachea</text>
  <text x="120" y="331" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" fill="#333">Flexible conduit to lungs</text>

  <!-- RIGHT COLUMN: Bronchi, Alveoli, Lungs -->
  <rect x="250" y="45" width="390" height="30" rx="6" fill="#548235"/>
  <text x="445" y="65" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="white">LUNG STRUCTURE &amp; FUNCTION</text>

  <!-- Bronchi -->
  <rect x="250" y="85" width="170" height="48" rx="6" fill="#E2EFDA" stroke="#548235" stroke-width="1.5"/>
  <text x="335" y="104" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#548235">Bronchi &amp; Bronchioles</text>
  <text x="335" y="120" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" fill="#333">Branch from trachea</text>
  <text x="335" y="130" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" fill="#333">into each lung</text>

  <!-- Alveoli -->
  <rect x="440" y="85" width="190" height="48" rx="6" fill="#E2EFDA" stroke="#548235" stroke-width="1.5"/>
  <text x="535" y="104" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#548235">Alveolar Ducts</text>
  <text x="535" y="120" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" fill="#333">300 million alveoli</text>
  <text x="535" y="130" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" fill="#333">Gas exchange by diffusion</text>

  <!-- Gas exchange pressures box -->
  <rect x="250" y="150" width="380" height="85" rx="6" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.5"/>
  <text x="440" y="168" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#BF8F00">Gas Exchange — Partial Pressures</text>
  <text x="280" y="188" font-family="DejaVu Sans, Arial, sans-serif" font-size="9.5" fill="#1F3864" font-weight="bold">In alveoli (lungs):</text>
  <text x="280" y="202" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#333">O₂ = 138 hPa  →  CO₂ = 53 hPa</text>
  <text x="430" y="188" font-family="DejaVu Sans, Arial, sans-serif" font-size="9.5" fill="#1F3864" font-weight="bold">In blood (venous):</text>
  <text x="430" y="202" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#333">O₂ = 52 hPa  →  CO₂ = 62 hPa</text>
  <text x="440" y="225" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" fill="#666" font-style="italic">O₂ diffuses from alveoli → blood | CO₂ diffuses from blood → alveoli</text>

  <!-- Ventilation control -->
  <rect x="250" y="248" width="380" height="55" rx="6" fill="#FBE5E5" stroke="#C00000" stroke-width="1.5"/>
  <text x="440" y="266" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#C00000">Ventilation Control</text>
  <text x="440" y="282" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#333">Primarily regulated by CO₂ partial pressure in arterial blood (CNS)</text>
  <text x="440" y="295" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#333">O₂ influence is moderate (carotid corpuscles)</text>

  <!-- Volumes box -->
  <rect x="250" y="316" width="380" height="34" rx="6" fill="#DEEAF6" stroke="#2E75B6" stroke-width="1.5"/>
  <text x="440" y="330" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#1F3864"><tspan font-weight="bold">Tidal vol: 0.5 L</tspan>  |  Inspiratory reserve: 3 L  |  Expiratory reserve: 1 L</text>
  <text x="440" y="344" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#1F3864"><tspan font-weight="bold">Vital capacity: 4.5L ♀ / 5.5L ♂</tspan>  |  Residual vol: 1-2 L  |  <tspan font-weight="bold">Total: 7 L</tspan></text>
</svg>
