<svg viewBox="0 0 760 500" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="760" height="500" fill="#F8F9FA"/>

  <!-- Title -->
  <text x="380" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F3864">Centres d'action — Décalage vertical Sol / Altitude</text>

  <!-- ═══════════════ THERMAL PANEL (left) ═══════════════ -->
  <!-- Panel header -->
  <rect x="20" y="42" width="340" height="28" rx="6" fill="#1F3864"/>
  <text x="190" y="61" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Effet THERMIQUE</text>

  <!-- === Warm Low (thermal) === -->
  <rect x="20" y="80" width="155" height="175" rx="6" fill="#FBE5E5" stroke="#C00000" stroke-width="1.5"/>
  <text x="97" y="100" text-anchor="middle" font-size="10" font-weight="bold" fill="#C00000">WARM LOW</text>
  <!-- Air chaud column -->
  <rect x="65" y="110" width="60" height="110" rx="3" fill="#FFCCCC" opacity="0.8"/>
  <!-- Altitude (top) = H -->
  <text x="97" y="123" text-anchor="middle" font-size="9" fill="#548235">Altitude : H ↑</text>
  <!-- Ground (bottom) = L -->
  <text x="97" y="208" text-anchor="middle" font-size="9" fill="#C00000">Sol : L ↓</text>
  <text x="97" y="220" text-anchor="middle" font-size="8.5" fill="#333333">Air chaud → ascendance</text>
  <text x="97" y="232" text-anchor="middle" font-size="8.5" fill="#333333">naturelle</text>
  <!-- Arrow up -->
  <line x1="97" y1="200" x2="97" y2="138" stroke="#C00000" stroke-width="1.8"/>
  <polygon points="97,130 93,144 101,144" fill="#C00000"/>
  <!-- Labels H/L badges -->
  <rect x="125" y="107" width="22" height="18" rx="3" fill="#E2EFDA" stroke="#548235" stroke-width="1"/>
  <text x="136" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#548235">H</text>
  <rect x="125" y="188" width="22" height="18" rx="3" fill="#FBE5E5" stroke="#C00000" stroke-width="1"/>
  <text x="136" y="201" text-anchor="middle" font-size="11" font-weight="bold" fill="#C00000">L</text>

  <!-- === Cold High (thermal) === -->
  <rect x="185" y="80" width="155" height="175" rx="6" fill="#DEEAF6" stroke="#2E75B6" stroke-width="1.5"/>
  <text x="262" y="100" text-anchor="middle" font-size="10" font-weight="bold" fill="#2E75B6">COLD HIGH</text>
  <!-- Air froid column -->
  <rect x="230" y="110" width="60" height="110" rx="3" fill="#C6DCF5" opacity="0.8"/>
  <!-- Altitude (top) = L -->
  <text x="262" y="123" text-anchor="middle" font-size="9" fill="#C00000">Altitude : L ↓</text>
  <!-- Ground (bottom) = H -->
  <text x="262" y="208" text-anchor="middle" font-size="9" fill="#548235">Sol : H ↑</text>
  <text x="262" y="220" text-anchor="middle" font-size="8.5" fill="#333333">Air froid → subsidence</text>
  <text x="262" y="232" text-anchor="middle" font-size="8.5" fill="#333333">naturelle</text>
  <!-- Arrow down -->
  <line x1="262" y1="135" x2="262" y2="197" stroke="#2E75B6" stroke-width="1.8"/>
  <polygon points="262,205 258,191 266,191" fill="#2E75B6"/>
  <!-- Labels H/L badges -->
  <rect x="290" y="107" width="22" height="18" rx="3" fill="#FBE5E5" stroke="#C00000" stroke-width="1"/>
  <text x="301" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#C00000">L</text>
  <rect x="290" y="188" width="22" height="18" rx="3" fill="#E2EFDA" stroke="#548235" stroke-width="1"/>
  <text x="301" y="201" text-anchor="middle" font-size="11" font-weight="bold" fill="#548235">H</text>

  <!-- Thermal rule box -->
  <rect x="20" y="265" width="340" height="48" rx="6" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.5"/>
  <text x="190" y="282" text-anchor="middle" font-size="9.5" fill="#1F3864">Air chaud → faible poids de colonne → L en surface, H en altitude</text>
  <text x="190" y="297" text-anchor="middle" font-size="9.5" fill="#1F3864">Air froid → fort poids de colonne → H en surface, L en altitude</text>
  <text x="190" y="310" text-anchor="middle" font-size="9" font-style="italic" fill="#555555">Le signe change entre la surface et l'altitude (décalage vertical)</text>

  <!-- ═══════════════ DYNAMIC PANEL (right) ═══════════════ -->
  <rect x="400" y="42" width="340" height="28" rx="6" fill="#1F3864"/>
  <text x="570" y="61" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Effet DYNAMIQUE</text>

  <!-- === Warm High (dynamic) === -->
  <rect x="400" y="80" width="155" height="175" rx="6" fill="#E2EFDA" stroke="#548235" stroke-width="1.5"/>
  <text x="477" y="100" text-anchor="middle" font-size="10" font-weight="bold" fill="#548235">WARM HIGH</text>
  <!-- Air chaud forcé à descendre -->
  <rect x="445" y="110" width="60" height="110" rx="3" fill="#FFCCCC" opacity="0.8"/>
  <text x="477" y="123" text-anchor="middle" font-size="9" fill="#548235">Altitude : H ↑</text>
  <text x="477" y="208" text-anchor="middle" font-size="9" fill="#548235">Sol : H ↑</text>
  <text x="477" y="220" text-anchor="middle" font-size="8.5" fill="#333333">Subsidence dynamique</text>
  <text x="477" y="232" text-anchor="middle" font-size="8.5" fill="#333333">inverse l'effet thermique</text>
  <!-- Arrow down (forced) -->
  <line x1="477" y1="135" x2="477" y2="197" stroke="#548235" stroke-width="1.8" stroke-dasharray="4,3"/>
  <polygon points="477,205 473,191 481,191" fill="#548235"/>
  <!-- Labels -->
  <rect x="505" y="107" width="22" height="18" rx="3" fill="#E2EFDA" stroke="#548235" stroke-width="1"/>
  <text x="516" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#548235">H</text>
  <rect x="505" y="188" width="22" height="18" rx="3" fill="#E2EFDA" stroke="#548235" stroke-width="1"/>
  <text x="516" y="201" text-anchor="middle" font-size="11" font-weight="bold" fill="#548235">H</text>

  <!-- === Cold Low (dynamic) === -->
  <rect x="565" y="80" width="155" height="175" rx="6" fill="#FBE5E5" stroke="#C00000" stroke-width="1.5"/>
  <text x="642" y="100" text-anchor="middle" font-size="10" font-weight="bold" fill="#C00000">COLD LOW</text>
  <!-- Air froid forcé à monter -->
  <rect x="610" y="110" width="60" height="110" rx="3" fill="#C6DCF5" opacity="0.8"/>
  <text x="642" y="123" text-anchor="middle" font-size="9" fill="#C00000">Altitude : L ↓</text>
  <text x="642" y="208" text-anchor="middle" font-size="9" fill="#C00000">Sol : L ↓</text>
  <text x="642" y="220" text-anchor="middle" font-size="8.5" fill="#333333">Ascendance dynamique</text>
  <text x="642" y="232" text-anchor="middle" font-size="8.5" fill="#333333">inverse l'effet thermique</text>
  <!-- Arrow up (forced) -->
  <line x1="642" y1="200" x2="642" y2="138" stroke="#C00000" stroke-width="1.8" stroke-dasharray="4,3"/>
  <polygon points="642,130 638,144 646,144" fill="#C00000"/>
  <!-- Labels -->
  <rect x="670" y="107" width="22" height="18" rx="3" fill="#FBE5E5" stroke="#C00000" stroke-width="1"/>
  <text x="681" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#C00000">L</text>
  <rect x="670" y="188" width="22" height="18" rx="3" fill="#FBE5E5" stroke="#C00000" stroke-width="1"/>
  <text x="681" y="201" text-anchor="middle" font-size="11" font-weight="bold" fill="#C00000">L</text>

  <!-- Dynamic rule box -->
  <rect x="400" y="265" width="340" height="48" rx="6" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.5"/>
  <text x="570" y="282" text-anchor="middle" font-size="9.5" fill="#1F3864">Warm High (H/H) : subsidence force l'air chaud au sol → anticyclone</text>
  <text x="570" y="297" text-anchor="middle" font-size="9.5" fill="#1F3864">Cold Low (L/L) : ascendance force l'air froid → dépression au sol</text>
  <text x="570" y="310" text-anchor="middle" font-size="9" font-style="italic" fill="#555555">Le même signe en surface et en altitude (pas de décalage vertical)</text>

  <!-- ═══════════════ Bottom summary table ═══════════════ -->
  <rect x="20" y="328" width="720" height="140" rx="8" fill="white" stroke="#AAAAAA" stroke-width="1.2"/>
  <text x="380" y="348" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F3864">Tableau récapitulatif des 4 centres d'action</text>

  <!-- Table header -->
  <rect x="25" y="355" width="710" height="24" rx="3" fill="#1F3864"/>
  <text x="100" y="371" text-anchor="middle" font-size="9.5" fill="white" font-weight="bold">Centre d'action</text>
  <text x="280" y="371" text-anchor="middle" font-size="9.5" fill="white" font-weight="bold">Température air</text>
  <text x="440" y="371" text-anchor="middle" font-size="9.5" fill="white" font-weight="bold">Mécanisme</text>
  <text x="570" y="371" text-anchor="middle" font-size="9.5" fill="white" font-weight="bold">Sol</text>
  <text x="680" y="371" text-anchor="middle" font-size="9.5" fill="white" font-weight="bold">Altitude</text>

  <!-- Table rows -->
  <!-- Row 1 -->
  <rect x="25" y="379" width="710" height="22" rx="0" fill="#FBE5E5"/>
  <text x="100" y="394" text-anchor="middle" font-size="9.5" fill="#C00000" font-weight="bold">Warm Low</text>
  <text x="280" y="394" text-anchor="middle" font-size="9.5" fill="#333333">Chaud</text>
  <text x="440" y="394" text-anchor="middle" font-size="9.5" fill="#333333">Thermique (ascendance naturelle)</text>
  <text x="570" y="394" text-anchor="middle" font-size="9.5" fill="#C00000" font-weight="bold">L</text>
  <text x="680" y="394" text-anchor="middle" font-size="9.5" fill="#548235" font-weight="bold">H</text>
  <!-- Row 2 -->
  <rect x="25" y="401" width="710" height="22" rx="0" fill="#E2EFDA"/>
  <text x="100" y="416" text-anchor="middle" font-size="9.5" fill="#548235" font-weight="bold">Warm High</text>
  <text x="280" y="416" text-anchor="middle" font-size="9.5" fill="#333333">Chaud</text>
  <text x="440" y="416" text-anchor="middle" font-size="9.5" fill="#333333">Dynamique (subsidence forcée)</text>
  <text x="570" y="416" text-anchor="middle" font-size="9.5" fill="#548235" font-weight="bold">H</text>
  <text x="680" y="416" text-anchor="middle" font-size="9.5" fill="#548235" font-weight="bold">H</text>
  <!-- Row 3 -->
  <rect x="25" y="423" width="710" height="22" rx="0" fill="#DEEAF6"/>
  <text x="100" y="438" text-anchor="middle" font-size="9.5" fill="#2E75B6" font-weight="bold">Cold High</text>
  <text x="280" y="438" text-anchor="middle" font-size="9.5" fill="#333333">Froid</text>
  <text x="440" y="438" text-anchor="middle" font-size="9.5" fill="#333333">Thermique (subsidence naturelle)</text>
  <text x="570" y="438" text-anchor="middle" font-size="9.5" fill="#548235" font-weight="bold">H</text>
  <text x="680" y="438" text-anchor="middle" font-size="9.5" fill="#C00000" font-weight="bold">L</text>
  <!-- Row 4 -->
  <rect x="25" y="445" width="710" height="22" rx="0" fill="#FBE5E5"/>
  <text x="100" y="460" text-anchor="middle" font-size="9.5" fill="#C00000" font-weight="bold">Cold Low</text>
  <text x="280" y="460" text-anchor="middle" font-size="9.5" fill="#333333">Froid</text>
  <text x="440" y="460" text-anchor="middle" font-size="9.5" fill="#333333">Dynamique (ascendance forcée)</text>
  <text x="570" y="460" text-anchor="middle" font-size="9.5" fill="#C00000" font-weight="bold">L</text>
  <text x="680" y="460" text-anchor="middle" font-size="9.5" fill="#C00000" font-weight="bold">L</text>
</svg>
