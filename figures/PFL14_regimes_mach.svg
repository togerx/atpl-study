<svg viewBox="0 0 720 110" xmlns="http://www.w3.org/2000/svg">
  <!-- Barre de régimes -->
  <rect x="10" y="40" width="700" height="30" rx="0" fill="#DEEAF6" stroke="#2E75B6" stroke-width="1.5"/>
  <!-- Zone Low subsonic -->
  <rect x="10" y="40" width="150" height="30" fill="#E2EFDA" stroke="#548235" stroke-width="1.5"/>
  <text x="85" y="59" text-anchor="middle" font-family="Arial" font-size="11" fill="#1F3864">Low subsonic</text>
  <text x="85" y="90" text-anchor="middle" font-family="Arial" font-size="10" fill="#548235">Incompressible</text>
  <!-- Zone High subsonic -->
  <rect x="160" y="40" width="200" height="30" fill="#DEEAF6" stroke="#2E75B6" stroke-width="1.5"/>
  <text x="260" y="59" text-anchor="middle" font-family="Arial" font-size="11" fill="#1F3864">High subsonic</text>
  <text x="260" y="90" text-anchor="middle" font-family="Arial" font-size="10" fill="#2E75B6">Compressible</text>
  <!-- Zone Transonic -->
  <rect x="360" y="40" width="170" height="30" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.5"/>
  <text x="445" y="59" text-anchor="middle" font-family="Arial" font-size="11" fill="#1F3864">Transonic</text>
  <text x="445" y="90" text-anchor="middle" font-family="Arial" font-size="10" fill="#BF8F00">Mixed sub/supersonic</text>
  <!-- Zone Supersonic -->
  <rect x="530" y="40" width="180" height="30" fill="#FBE5E5" stroke="#C00000" stroke-width="1.5"/>
  <text x="620" y="59" text-anchor="middle" font-family="Arial" font-size="11" fill="#1F3864">Supersonic</text>
  <text x="620" y="90" text-anchor="middle" font-family="Arial" font-size="10" fill="#C00000">M &gt; 1.2</text>
  <!-- Marqueurs Mach -->
  <line x1="160" y1="30" x2="160" y2="75" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="160" y="24" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">M 0.3</text>
  <line x1="360" y1="30" x2="360" y2="75" stroke="#BF8F00" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="360" y="24" text-anchor="middle" font-family="Arial" font-size="10" fill="#BF8F00">Mcrit (~0.75)</text>
  <line x1="530" y1="30" x2="530" y2="75" stroke="#C00000" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="530" y="24" text-anchor="middle" font-family="Arial" font-size="10" fill="#C00000">M 1.2</text>
</svg>
