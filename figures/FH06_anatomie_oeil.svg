<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380">
  <!-- FH06 Anatomie de l'oeil - Schéma en coupe -->
  <!-- Elements: globe oculaire ellipse cx=360 cy=190 rx=145 ry=145 -->
  <!-- Cornée arc avant, Iris, Pupille, Cristallin, Humeur aqueuse, Humeur vitrée -->
  <!-- Rétine arc arrière, Fovéa, Papille (tache aveugle), Nerf optique -->
  <!-- Sclérotique, Choroïde, Muscles oculaires -->

  <!-- Fond transparent -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1F3864"/>
    </marker>
    <!-- Gradient pour l'humeur vitrée -->
    <radialGradient id="vitreous" cx="55%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#e8f4f8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c8dfe8" stop-opacity="0.7"/>
    </radialGradient>
    <!-- Gradient choroïde -->
    <linearGradient id="choroid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4a0a0"/>
      <stop offset="100%" stop-color="#c88080"/>
    </linearGradient>
  </defs>

  <!-- === GLOBE OCULAIRE === -->
  <!-- Sclérotique (blanc de l'œil) - couche externe -->
  <ellipse cx="360" cy="190" rx="148" ry="148" fill="#f5f0e8" stroke="#8a7a6a" stroke-width="2.5"/>
  <!-- Choroïde - couche vasculaire interne -->
  <ellipse cx="360" cy="190" rx="138" ry="138" fill="url(#choroid)" opacity="0.5"/>
  <!-- Rétine - couche interne (légèrement plus petite) -->
  <ellipse cx="360" cy="190" rx="130" ry="130" fill="url(#vitreous)"/>

  <!-- Sclérotique - arc extérieur visible (blanc) -->
  <path d="M 360,42 A 148,148 0 0 1 360,338" fill="#f5f0e8" stroke="#8a7a6a" stroke-width="2"/>

  <!-- Cornée - partie avant transparente (saillie) -->
  <path d="M 210,155 Q 190,190 210,225" fill="none" stroke="#6ab8d4" stroke-width="3.5" opacity="0.8"/>
  <path d="M 210,155 Q 178,190 210,225" fill="#d4eef8" fill-opacity="0.5" stroke="none"/>
  <path d="M 210,155 Q 178,190 210,225 Q 190,190 210,155" fill="#c8e8f4" fill-opacity="0.4" stroke="#6ab8d4" stroke-width="2.5"/>

  <!-- Axe optique -->
  <line x1="165" y1="190" x2="520" y2="190" stroke="#1F3864" stroke-width="1" stroke-dasharray="5,4" opacity="0.4"/>

  <!-- Iris (anneau coloré) -->
  <circle cx="245" cy="190" r="38" fill="#5a7fa0" stroke="#3a5f80" stroke-width="1.5"/>
  <!-- Pupille (centre noir) -->
  <circle cx="245" cy="190" r="16" fill="#111" stroke="#222" stroke-width="1"/>

  <!-- Cristallin (lentille biconvexe) -->
  <ellipse cx="285" cy="190" rx="22" ry="36" fill="#d8f0e0" fill-opacity="0.7" stroke="#548235" stroke-width="2"/>

  <!-- Muscles ciliaires -->
  <line x1="268" y1="155" x2="255" y2="152" stroke="#c00000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="268" y1="225" x2="255" y2="228" stroke="#c00000" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Fovéa (tache jaune) -->
  <circle cx="490" cy="190" r="7" fill="#f0c040" stroke="#bf8f00" stroke-width="1.5"/>

  <!-- Papille / Tache aveugle -->
  <ellipse cx="475" cy="230" rx="10" ry="7" fill="#e8d0a0" stroke="#8a7040" stroke-width="1.5"/>

  <!-- Nerf optique -->
  <rect x="508" y="183" width="50" height="14" rx="4" fill="#c080c0" stroke="#8040a0" stroke-width="1.5"/>

  <!-- Artère ophtalmique (petite ligne rouge en parallèle) -->
  <line x1="508" y1="200" x2="558" y2="200" stroke="#c00000" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Humeur aqueuse (avant le cristallin) -->
  <path d="M 210,162 Q 247,153 280,162 L 280,218 Q 247,227 210,218 Z" fill="#b8e8f8" fill-opacity="0.3" stroke="none"/>

  <!-- === LÉGENDES GAUCHE === -->
  <!-- Cornée -->
  <line x1="185" y1="172" x2="130" y2="130" stroke="#1F3864" stroke-width="1.2" marker-end="url(#arrow)" opacity="0.8"/>
  <text x="125" y="123" font-family="Arial" font-size="11" fill="#1F3864" text-anchor="middle">Cornée</text>

  <!-- Iris -->
  <line x1="240" y1="152" x2="210" y2="100" stroke="#1F3864" stroke-width="1.2" marker-end="url(#arrow)" opacity="0.8"/>
  <text x="210" y="93" font-family="Arial" font-size="11" fill="#1F3864" text-anchor="middle">Iris</text>

  <!-- Pupille -->
  <line x1="243" y1="175" x2="170" y2="155" stroke="#1F3864" stroke-width="1.2" marker-end="url(#arrow)" opacity="0.8"/>
  <text x="130" y="152" font-family="Arial" font-size="11" fill="#1F3864" text-anchor="end">Pupille</text>

  <!-- Cristallin -->
  <line x1="285" y1="154" x2="285" y2="85" stroke="#1F3864" stroke-width="1.2" marker-end="url(#arrow)" opacity="0.8"/>
  <text x="285" y="78" font-family="Arial" font-size="11" fill="#1F3864" text-anchor="middle">Cristallin</text>

  <!-- Muscles ciliaires -->
  <line x1="262" y1="153" x2="230" y2="65" stroke="#c00000" stroke-width="1.2" marker-end="url(#arrow)" opacity="0.8"/>
  <text x="230" y="58" font-family="Arial" font-size="11" fill="#c00000" text-anchor="middle">Muscles ciliaires</text>

  <!-- Humeur aqueuse -->
  <line x1="235" y1="190" x2="155" y2="250" stroke="#1F3864" stroke-width="1.2" marker-end="url(#arrow)" opacity="0.8"/>
  <text x="100" y="265" font-family="Arial" font-size="11" fill="#1F3864" text-anchor="middle">Humeur aqueuse</text>

  <!-- Humeur vitrée -->
  <line x1="370" y1="260" x2="310" y2="310" stroke="#1F3864" stroke-width="1.2" marker-end="url(#arrow)" opacity="0.8"/>
  <text x="265" y="323" font-family="Arial" font-size="11" fill="#1F3864" text-anchor="middle">Humeur vitrée</text>

  <!-- === LÉGENDES DROITE === -->
  <!-- Sclérotique -->
  <line x1="400" y1="42" x2="450" y2="25" stroke="#1F3864" stroke-width="1.2" marker-end="url(#arrow)" opacity="0.8"/>
  <text x="535" y="22" font-family="Arial" font-size="11" fill="#1F3864" text-anchor="middle">Sclérotique</text>

  <!-- Choroïde -->
  <line x1="415" y1="60" x2="480" y2="48" stroke="#1F3864" stroke-width="1.2" marker-end="url(#arrow)" opacity="0.8"/>
  <text x="570" y="46" font-family="Arial" font-size="11" fill="#1F3864" text-anchor="middle">Choroïde</text>

  <!-- Rétine -->
  <line x1="430" y1="80" x2="510" y2="72" stroke="#1F3864" stroke-width="1.2" marker-end="url(#arrow)" opacity="0.8"/>
  <text x="600" y="70" font-family="Arial" font-size="11" fill="#1F3864" text-anchor="middle">Rétine</text>

  <!-- Fovéa -->
  <line x1="495" y1="186" x2="560" y2="130" stroke="#bf8f00" stroke-width="1.2" marker-end="url(#arrow)" opacity="0.9"/>
  <text x="610" y="125" font-family="Arial" font-size="11" fill="#bf8f00" font-weight="bold" text-anchor="middle">Fovéa</text>

  <!-- Papille (tache aveugle) -->
  <line x1="484" y1="230" x2="565" y2="255" stroke="#1F3864" stroke-width="1.2" marker-end="url(#arrow)" opacity="0.8"/>
  <text x="645" y="260" font-family="Arial" font-size="11" fill="#c00000" font-weight="bold" text-anchor="middle">Papille</text>
  <text x="645" y="273" font-family="Arial" font-size="10" fill="#c00000" text-anchor="middle">(tache aveugle)</text>

  <!-- Nerf optique -->
  <line x1="530" y1="197" x2="590" y2="215" stroke="#1F3864" stroke-width="1.2" marker-end="url(#arrow)" opacity="0.8"/>
  <text x="665" y="220" font-family="Arial" font-size="11" fill="#1F3864" text-anchor="middle">Nerf optique</text>

  <!-- Artère ophtalmique -->
  <line x1="530" y1="202" x2="590" y2="232" stroke="#c00000" stroke-width="1.2" marker-end="url(#arrow)" opacity="0.8"/>
  <text x="665" y="245" font-family="Arial" font-size="11" fill="#1F3864" text-anchor="middle">Art. ophtalmique</text>

  <!-- Axe optique label -->
  <text x="165" y="183" font-family="Arial" font-size="10" fill="#1F3864" text-anchor="start" font-style="italic" opacity="0.6">Axe optique</text>

  <!-- Titre -->
  <text x="360" y="372" font-family="Arial" font-size="12" fill="#1F3864" text-anchor="middle" font-weight="bold">Anatomie de l'œil en coupe sagittale</text>
</svg>
