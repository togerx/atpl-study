<svg viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1F3864"/>
    </marker>
    <marker id="arr_red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#C00000"/>
    </marker>
    <marker id="arr_green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#548235"/>
    </marker>
  </defs>
  <!-- Onde de choc verticale -->
  <line x1="350" y1="10" x2="350" y2="190" stroke="#C00000" stroke-width="3"/>
  <text x="350" y="8" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#C00000">Onde de choc normale</text>
  <!-- Labels côtés -->
  <text x="180" y="30" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#2E75B6">SUPERSONIQUE (M₁ &gt; 1)</text>
  <text x="530" y="30" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#548235">SUBSONIQUE (M₂ &lt; 1)</text>
  <!-- Ligne flux -->
  <line x1="50" y1="100" x2="310" y2="100" stroke="#1F3864" stroke-width="2" marker-end="url(#arr)"/>
  <text x="180" y="95" text-anchor="middle" font-family="Arial" font-size="10" fill="#1F3864">V₁ (rapide)</text>
  <line x1="390" y1="100" x2="640" y2="100" stroke="#1F3864" stroke-width="2" marker-end="url(#arr)"/>
  <text x="515" y="95" text-anchor="middle" font-family="Arial" font-size="10" fill="#1F3864">V₂ &lt; V₁ (lente)</text>
  <!-- Colonne gauche : paramètres avant choc -->
  <text x="100" y="140" text-anchor="middle" font-family="Arial" font-size="11" fill="#2E75B6">P₁ faible</text>
  <text x="100" y="158" text-anchor="middle" font-family="Arial" font-size="11" fill="#2E75B6">ρ₁ faible</text>
  <text x="100" y="176" text-anchor="middle" font-family="Arial" font-size="11" fill="#2E75B6">T₁ faible</text>
  <!-- Colonne droite : paramètres après choc -->
  <text x="500" y="140" text-anchor="middle" font-family="Arial" font-size="11" fill="#548235">P₂ &gt; P₁ ↑</text>
  <text x="500" y="158" text-anchor="middle" font-family="Arial" font-size="11" fill="#548235">ρ₂ &gt; ρ₁ ↑</text>
  <text x="500" y="176" text-anchor="middle" font-family="Arial" font-size="11" fill="#548235">T₂ &gt; T₁ ↑</text>
  <!-- Pt : pression totale -->
  <text x="220" y="185" text-anchor="middle" font-family="Arial" font-size="10" fill="#BF8F00">Ti constante</text>
  <text x="490" y="185" text-anchor="middle" font-family="Arial" font-size="10" fill="#C00000">Pt₂ &lt; Pt₁ (irréversible !)</text>
</svg>
