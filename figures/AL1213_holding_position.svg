<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300">
  
  <defs>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#C00000"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2E75B6"/>
    </marker>
  </defs>

  <!-- PISTE -->
  <rect x="0" y="120" width="680" height="60" fill="#777" stroke="#333" stroke-width="2"/>
  <!-- Centerline -->
  <line x1="0" y1="150" x2="680" y2="150" stroke="white" stroke-width="2" stroke-dasharray="20,12"/>
  <!-- Seuil gauche -->
  <rect x="5" y="125" width="10" height="8" fill="white" rx="1"/>
  <rect x="5" y="140" width="10" height="8" fill="white" rx="1"/>
  <rect x="5" y="163" width="10" height="8" fill="white" rx="1"/>
  <text x="30" y="155" font-family="Arial" font-size="11" fill="white">RUNWAY</text>

  <!-- Landing aircraft (en approche depuis la gauche) -->
  <!-- Avion atterrissage (flèche vers droite) -->
  <text x="30" y="108" font-family="Arial" font-size="28" fill="#2E75B6">✈</text>
  <line x1="62" y1="108" x2="100" y2="108" stroke="#2E75B6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="40" y="92" font-family="Arial" font-size="11" fill="#2E75B6">Landing aircraft</text>
  <line x1="80" y1="95" x2="80" y2="115" stroke="#2E75B6" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- HOLDING POSITION LINE — piste ≥ 900m (50m) -->
  <!-- Distance 50m -->
  <line x1="380" y1="75" x2="380" y2="185" stroke="#C00000" stroke-width="3" stroke-dasharray="12,5"/>
  <!-- Double lignes marquage (2 pleines + 2 pointillées) -->
  <line x1="360" y1="75" x2="360" y2="185" stroke="#F4C542" stroke-width="2.5"/>
  <line x1="367" y1="75" x2="367" y2="185" stroke="#F4C542" stroke-width="2.5" stroke-dasharray="10,5"/>
  <line x1="374" y1="75" x2="374" y2="185" stroke="#F4C542" stroke-width="2" stroke-dasharray="10,5"/>
  <!-- Label holding pos -->
  <text x="362" y="68" text-anchor="middle" font-family="Arial" font-size="10" fill="#C00000" font-weight="bold">HOLDING POSITION</text>
  
  <!-- Flèche distance 50m -->
  <line x1="380" y1="200" x2="460" y2="200" stroke="#C00000" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <line x1="380" y1="200" x2="380" y2="180" stroke="#C00000" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="460" y1="200" x2="460" y2="182" stroke="#C00000" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="420" y="220" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#C00000">≥ 50 m</text>
  <text x="420" y="234" text-anchor="middle" font-family="Arial" font-size="10" fill="#C00000">(RWY ≥ 900 m)</text>
  
  <!-- HOLDING POSITION LINE — piste &lt; 900m (30m) -->
  <line x1="490" y1="75" x2="490" y2="185" stroke="#BF8F00" stroke-width="3" stroke-dasharray="12,5"/>
  <line x1="470" y1="75" x2="470" y2="185" stroke="#F4C542" stroke-width="2.5"/>
  <line x1="477" y1="75" x2="477" y2="185" stroke="#F4C542" stroke-width="2.5" stroke-dasharray="10,5"/>
  <text x="482" y="68" text-anchor="middle" font-family="Arial" font-size="10" fill="#BF8F00" font-weight="bold">HOLDING POSITION</text>

  <!-- Flèche distance 30m -->
  <line x1="490" y1="245" x2="460" y2="245" stroke="#BF8F00" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <line x1="490" y1="245" x2="490" y2="182" stroke="#BF8F00" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="460" y1="245" x2="460" y2="182" stroke="#BF8F00" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="475" y="265" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#BF8F00">≥ 30 m</text>
  <text x="475" y="279" text-anchor="middle" font-family="Arial" font-size="10" fill="#BF8F00">(RWY &lt; 900 m)</text>
  
  <!-- Avion en attente (holding) -->
  <text x="550" y="108" font-family="Arial" font-size="24" fill="#548235" transform="rotate(90 562 108)">✈</text>
  <text x="545" y="85" font-family="Arial" font-size="11" fill="#548235">Holding aircraft</text>

  <!-- Bord de piste (edge) marquage -->
  <line x1="460" y1="120" x2="460" y2="180" stroke="#555" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="462" y="115" font-family="Arial" font-size="9" fill="#555">RWY edge</text>

  <!-- Légende régle -->
  <rect x="10" y="220" width="340" height="68" fill="#FBE5E5" stroke="#C00000" stroke-width="1" rx="5"/>
  <text x="20" y="238" font-family="Arial" font-size="11" font-weight="bold" fill="#C00000">⚠️ Règle de non-empiètement</text>
  <text x="20" y="255" font-family="Arial" font-size="10.5" fill="#333">Un aéronef ne peut s'aligner sur la piste</text>
  <text x="20" y="270" font-family="Arial" font-size="10.5" fill="#333">tant que l'avion en atterrissage n'a pas</text>
  <text x="20" y="285" font-family="Arial" font-size="10.5" fill="#333">franchi le <tspan font-weight="bold">holding position point</tspan>.</text>
</svg>
