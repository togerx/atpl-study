<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <!-- Titre -->
  <text x="360" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F3864">Les 3 types de pression</text>

  <!-- === COLONNE 1 : ABSOLUTE === -->
  <!-- Boîte principale -->
  <rect x="30" y="50" width="190" height="80" rx="8" fill="#DEEAF6" stroke="#2E75B6" stroke-width="1.5"/>
  <text x="125" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F3864">Pression Absolue</text>
  <text x="125" y="91" text-anchor="middle" font-size="10" fill="#1F3864">Référence : vide absolu</text>
  <text x="125" y="107" text-anchor="middle" font-size="10" fill="#1F3864">(0 Pa = vide parfait)</text>

  <!-- Diagramme barre -->
  <rect x="60" y="155" width="130" height="20" rx="3" fill="#e8e8e8" stroke="#ccc"/>
  <rect x="60" y="155" width="130" height="20" rx="3" fill="#2E75B6" opacity="0.7"/>
  <text x="125" y="169" text-anchor="middle" font-size="9" fill="white" font-weight="bold">P abs = 1013 hPa (MSL)</text>
  <!-- Axe -->
  <line x1="60" y1="175" x2="60" y2="195" stroke="#1F3864" stroke-width="1"/>
  <line x1="190" y1="175" x2="190" y2="195" stroke="#1F3864" stroke-width="1"/>
  <text x="60" y="208" text-anchor="middle" font-size="8" fill="#555">0 (vide)</text>
  <text x="190" y="208" text-anchor="middle" font-size="8" fill="#555">Pabs</text>

  <!-- Usage -->
  <rect x="30" y="225" width="190" height="55" rx="6" fill="#E2EFDA" stroke="#548235" stroke-width="1"/>
  <text x="125" y="243" text-anchor="middle" font-size="9" font-weight="bold" fill="#1F3864">Utilisation avion</text>
  <text x="125" y="257" text-anchor="middle" font-size="9" fill="#1F3864">• Capsule anéroïde</text>
  <text x="125" y="270" text-anchor="middle" font-size="9" fill="#1F3864">• Pression collecteur (MAP)</text>

  <!-- === COLONNE 2 : GAUGE (MANOMÉTRIQUE) === -->
  <rect x="265" y="50" width="190" height="80" rx="8" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.5"/>
  <text x="360" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F3864">Pression Manométrique</text>
  <text x="360" y="91" text-anchor="middle" font-size="10" fill="#1F3864">Référence : pression atmo.</text>
  <text x="360" y="107" text-anchor="middle" font-size="10" fill="#1F3864">P_man = P_abs − P_atm</text>

  <!-- Diagramme barre -->
  <rect x="295" y="155" width="130" height="20" rx="3" fill="#e8e8e8" stroke="#ccc"/>
  <rect x="295" y="155" width="65" height="20" rx="3" fill="#BF8F00" opacity="0.7"/>
  <text x="362" y="169" text-anchor="middle" font-size="9" fill="#1F3864" font-weight="bold">+/− vs atmo</text>
  <!-- Axe -->
  <line x1="295" y1="175" x2="295" y2="195" stroke="#1F3864" stroke-width="1"/>
  <line x1="425" y1="175" x2="425" y2="195" stroke="#1F3864" stroke-width="1"/>
  <text x="295" y="208" text-anchor="middle" font-size="8" fill="#555">0 (atmo)</text>
  <text x="425" y="208" text-anchor="middle" font-size="8" fill="#555">Pabs</text>

  <!-- Usage -->
  <rect x="265" y="225" width="190" height="55" rx="6" fill="#E2EFDA" stroke="#548235" stroke-width="1"/>
  <text x="360" y="243" text-anchor="middle" font-size="9" font-weight="bold" fill="#1F3864">Utilisation avion</text>
  <text x="360" y="257" text-anchor="middle" font-size="9" fill="#1F3864">• Pression d'huile</text>
  <text x="360" y="270" text-anchor="middle" font-size="9" fill="#1F3864">• Pression carburant</text>

  <!-- === COLONNE 3 : DIFFÉRENTIELLE === -->
  <rect x="500" y="50" width="190" height="80" rx="8" fill="#FBE5E5" stroke="#C00000" stroke-width="1.5"/>
  <text x="595" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F3864">Pression Différentielle</text>
  <text x="595" y="91" text-anchor="middle" font-size="10" fill="#1F3864">Référence : 2 prises de</text>
  <text x="595" y="107" text-anchor="middle" font-size="10" fill="#1F3864">pression P1 − P2</text>

  <!-- Diagramme barre -->
  <rect x="530" y="155" width="130" height="20" rx="3" fill="#e8e8e8" stroke="#ccc"/>
  <rect x="570" y="155" width="50" height="20" rx="3" fill="#C00000" opacity="0.7"/>
  <text x="595" y="169" text-anchor="middle" font-size="9" fill="white" font-weight="bold">ΔP = P1 − P2</text>
  <!-- Flèches P1 P2 -->
  <line x1="530" y1="175" x2="530" y2="195" stroke="#1F3864" stroke-width="1"/>
  <line x1="660" y1="175" x2="660" y2="195" stroke="#1F3864" stroke-width="1"/>
  <text x="530" y="208" text-anchor="middle" font-size="8" fill="#555">P2</text>
  <text x="660" y="208" text-anchor="middle" font-size="8" fill="#555">P1</text>

  <!-- Usage -->
  <rect x="500" y="225" width="190" height="55" rx="6" fill="#E2EFDA" stroke="#548235" stroke-width="1"/>
  <text x="595" y="243" text-anchor="middle" font-size="9" font-weight="bold" fill="#1F3864">Utilisation avion</text>
  <text x="595" y="257" text-anchor="middle" font-size="9" fill="#1F3864">• ΔP cabine (pressurisation)</text>
  <text x="595" y="270" text-anchor="middle" font-size="9" fill="#1F3864">• EPR (turbine)</text>

  <!-- Séparateurs verticaux légers -->
  <line x1="250" y1="45" x2="250" y2="290" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="485" y1="45" x2="485" y2="290" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Formule bas -->
  <rect x="200" y="290" width="320" height="22" rx="5" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1"/>
  <text x="360" y="305" text-anchor="middle" font-size="10" font-weight="bold" fill="#1F3864">P_manométrique = P_absolue − P_atmosphérique</text>

</svg>
