<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <!-- Background -->
  <rect width="720" height="420" fill="#F8F9FA"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F3864">Loi de Laplace — Épaisseur entre deux surfaces isobares</text>

  <!-- === LEFT PANEL : AIR CHAUD === -->
  <!-- Label -->
  <rect x="60" y="50" width="260" height="30" rx="6" fill="#FBE5E5" stroke="#C00000" stroke-width="1.5"/>
  <text x="190" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#C00000">Air CHAUD (Tm élevée)</text>

  <!-- Ground -->
  <rect x="60" y="360" width="260" height="14" rx="0" fill="#548235"/>

  <!-- Lower isobar P0 -->
  <line x1="60" y1="360" x2="320" y2="360" stroke="#1F3864" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="45" y="364" text-anchor="end" font-size="10" fill="#1F3864" font-weight="bold">P₀</text>

  <!-- Upper isobar P (high up in warm air) -->
  <line x1="60" y1="130" x2="320" y2="130" stroke="#C00000" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="45" y="134" text-anchor="end" font-size="10" fill="#C00000" font-weight="bold">P</text>

  <!-- Warm air column fill -->
  <rect x="110" y="130" width="160" height="230" fill="#FBE5E5" opacity="0.6" rx="4"/>

  <!-- Thickness arrow -->
  <line x1="200" y1="135" x2="200" y2="355" stroke="#C00000" stroke-width="2"/>
  <polygon points="200,128 195,142 205,142" fill="#C00000"/>
  <polygon points="200,362 195,348 205,348" fill="#C00000"/>
  <text x="215" y="240" font-size="11" font-weight="bold" fill="#C00000">GRANDE</text>
  <text x="215" y="255" font-size="11" font-weight="bold" fill="#C00000">épaisseur</text>
  <text x="215" y="272" font-size="10" fill="#C00000">(Z – Z₀ élevé)</text>

  <!-- Air chaud label inside -->
  <text x="160" y="248" text-anchor="middle" font-size="10" fill="#C00000">Air léger</text>
  <text x="160" y="262" text-anchor="middle" font-size="10" fill="#C00000">Faible densité</text>

  <!-- === RIGHT PANEL : AIR FROID === -->
  <!-- Label -->
  <rect x="400" y="50" width="260" height="30" rx="6" fill="#DEEAF6" stroke="#2E75B6" stroke-width="1.5"/>
  <text x="530" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E75B6">Air FROID (Tm basse)</text>

  <!-- Ground -->
  <rect x="400" y="360" width="260" height="14" rx="0" fill="#548235"/>

  <!-- Lower isobar P0 -->
  <line x1="400" y1="360" x2="660" y2="360" stroke="#1F3864" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="385" y="364" text-anchor="end" font-size="10" fill="#1F3864" font-weight="bold">P₀</text>

  <!-- Upper isobar P (lower altitude in cold air) -->
  <line x1="400" y1="255" x2="660" y2="255" stroke="#2E75B6" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="385" y="259" text-anchor="end" font-size="10" fill="#2E75B6" font-weight="bold">P</text>

  <!-- Cold air column fill -->
  <rect x="450" y="255" width="160" height="105" fill="#DEEAF6" opacity="0.7" rx="4"/>

  <!-- Thickness arrow -->
  <line x1="540" y1="260" x2="540" y2="355" stroke="#2E75B6" stroke-width="2"/>
  <polygon points="540,253 535,267 545,267" fill="#2E75B6"/>
  <polygon points="540,362 535,348 545,348" fill="#2E75B6"/>
  <text x="558" y="300" font-size="11" font-weight="bold" fill="#2E75B6">FAIBLE</text>
  <text x="558" y="315" font-size="11" font-weight="bold" fill="#2E75B6">épaisseur</text>
  <text x="558" y="332" font-size="10" fill="#2E75B6">(Z – Z₀ réduit)</text>

  <!-- Air froid label inside -->
  <text x="530" y="296" text-anchor="middle" font-size="10" fill="#2E75B6">Air lourd</text>
  <text x="530" y="310" text-anchor="middle" font-size="10" fill="#2E75B6">Forte densité</text>

  <!-- === FORMULA BOX === -->
  <rect x="220" y="378" width="280" height="36" rx="8" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.8"/>
  <text x="360" y="392" text-anchor="middle" font-size="11" font-weight="bold" fill="#BF8F00">Loi de Laplace :</text>
  <text x="360" y="408" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F3864">Z − Z₀ ≈ 67 445 · Tm · log(P₀/P)</text>
</svg>
