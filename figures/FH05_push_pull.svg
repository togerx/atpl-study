<svg viewBox="0 0 600 230" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <!-- Titre -->
  <text x="300" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F3864">Effet Push-Pull / Push-Pull Effect</text>

  <!-- PHASE 1: -Gz prolongé -->
  <rect x="10" y="40" width="165" height="80" rx="8" fill="#DEEAF6" stroke="#2E75B6" stroke-width="1.5"/>
  <text x="92" y="58" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2E75B6">PHASE 1 — −Gz prolongé</text>
  <text x="92" y="72" text-anchor="middle" font-size="8.5" fill="#1F3864">Prolonged negative/zero-G</text>
  <text x="18" y="88" font-size="8" fill="#1F3864">• Sang vers la tête / Blood to head</text>
  <text x="18" y="101" font-size="8" fill="#1F3864">• Fréq. cardiaque basse / Low heart rate</text>
  <text x="18" y="113" font-size="8" fill="#1F3864">• Vaisseaux jambes dilatés / Dilated vessels</text>

  <!-- Flèche 1→2 -->
  <line x1="177" y1="80" x2="218" y2="80" stroke="#C00000" stroke-width="2"/>
  <polygon points="225,80 212,74 212,86" fill="#C00000"/>
  <text x="199" y="73" text-anchor="middle" font-size="8" fill="#C00000" font-weight="bold">SOUDAIN</text>
  <text x="199" y="95" text-anchor="middle" font-size="7.5" fill="#C00000">sudden</text>

  <!-- PHASE 2: Bascule +Gz -->
  <rect x="228" y="40" width="165" height="80" rx="8" fill="#FBE5E5" stroke="#C00000" stroke-width="1.5"/>
  <text x="310" y="58" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#C00000">PHASE 2 — Bascule +Gz</text>
  <text x="310" y="72" text-anchor="middle" font-size="8.5" fill="#1F3864">Sudden pull / +2G even light a/c</text>
  <text x="236" y="88" font-size="8" fill="#1F3864">• Fréq. cardiaque trop basse / HR too low</text>
  <text x="236" y="101" font-size="8" fill="#1F3864">• Vaisseaux trop larges / Vessels too wide</text>
  <text x="236" y="113" font-size="8" fill="#1F3864">• Cerveau sans sang / Brain without blood</text>

  <!-- Flèche 2→3 -->
  <line x1="395" y1="80" x2="436" y2="80" stroke="#C00000" stroke-width="2"/>
  <polygon points="443,80 430,74 430,86" fill="#C00000"/>
  <text x="417" y="73" text-anchor="middle" font-size="8" fill="#C00000" font-weight="bold">RÉSULTAT</text>
  <text x="417" y="95" text-anchor="middle" font-size="7.5" fill="#C00000">result</text>

  <!-- PHASE 3: G-LOC immédiat -->
  <rect x="446" y="40" width="145" height="80" rx="8" fill="#4B0000" stroke="#C00000" stroke-width="2"/>
  <text x="518" y="60" text-anchor="middle" font-size="10" font-weight="bold" fill="white">G-LOC IMMÉDIAT</text>
  <text x="518" y="74" text-anchor="middle" font-size="8.5" fill="#FFCCCC">Immediate loss of</text>
  <text x="518" y="86" text-anchor="middle" font-size="8.5" fill="#FFCCCC">consciousness</text>
  <text x="518" y="102" text-anchor="middle" font-size="8" fill="#FF9999">même avec +2G !</text>
  <text x="518" y="115" text-anchor="middle" font-size="7.5" fill="#FF9999">even at +2G !</text>

  <!-- Exemple pratique -->
  <rect x="10" y="135" width="580" height="52" rx="8" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.5"/>
  <text x="20" y="152" font-size="9" font-weight="bold" fill="#1F3864">⚠️ Exemple / Example :</text>
  <text x="20" y="166" font-size="8.5" fill="#1F3864">Virage à −0,5G prolongé → évitement brusque à +2G → Black-out immédiat possible même sur Cessna !</text>
  <text x="20" y="180" font-size="8" fill="#666666" font-style="italic">Prolonged −0.5G turn → sudden evasion at +2G → Immediate blackout possible even in a Cessna!</text>

  <!-- Avertissement -->
  <rect x="10" y="196" width="580" height="28" rx="6" fill="#FBE5E5" stroke="#C00000" stroke-width="1.5"/>
  <text x="300" y="214" text-anchor="middle" font-size="9" font-weight="bold" fill="#C00000">De nombreux accidents mortels sont causés par le G-LOC ou l'effet push-pull · Many fatal accidents are caused by G-LOC or push-pull effect</text>

</svg>
